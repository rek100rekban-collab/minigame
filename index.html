function nearHut(x,y,r){return Math.hypot(x-HUT2.x,y-HUT2.y)<r;}
function buildWorld(){
 trees=[];bushes=[];
 var tries=0;
 while(trees.length<560&&tries<24000){
  tries++;
  var x=70+Math.random()*(WORLD-140),y=70+Math.random()*(WORLD-140);
  if(y>RY0-50&&y<RY1+50)continue;
  if(!far(x,y,clues,95))continue;
  if(Math.hypot(x-CAR.x,y-CAR.y)<240)continue;
  if(!far(x,y,crates,70))continue;
  if(!far(x,y,targets,90))continue;
  if(shells&&Math.hypot(x-shells.x,y-shells.y)<80)continue;
  if(Math.hypot(x-SHOTGUN_POS.x,y-SHOTGUN_POS.y)<90)continue;
  if(Math.hypot(x-CABIN.x,y-CABIN.y)<130)continue;
  if(nearHut(x,y,300))continue;
  if(Math.hypot(x-TABLET_POS.x,y-TABLET_POS.y)<160)continue;
  var ok=true;
  for(var i=0;i<trees.length;i++){if(Math.hypot(trees[i].x-x,trees[i].y-y)<46){ok=false;break;}}
  if(ok)trees.push({x:x,y:y,r:12+Math.random()*9,ph:Math.random()*6.28});
 }
 var bt=0;
 while(bushes.length<150&&bt<9000){
  bt++;
  var bx=80+Math.random()*(WORLD-160),by=60+Math.random()*(WORLD-140);
  if(by>RY0-20&&by<RY1+30)continue;
  if(!far(bx,by,clues,70))continue;
  if(Math.hypot(bx-CAR.x,by-CAR.y)<180)continue;
  if(nearHut(bx,by,260))continue;
  var ok2=true;
  for(var j=0;j<trees.length;j++){if(Math.hypot(trees[j].x-bx,trees[j].y-by)<trees[j].r+40){ok2=false;break;}}
  if(ok2)bushes.push({x:bx,y:by,r:26+Math.random()*14});
 }
}
function placeAll(){
 clues=[];crates=[];targets=[];
 var placed=[];
 function tryPlace(minSpacing){
  for(var t=0;t<4000;t++){
   var x=140+Math.random()*(WORLD-280),y=460+Math.random()*(WORLD-900);
   if(y>RY0-60&&y<RY1+60)continue;
   if(Math.hypot(x-CAR.x,y-CAR.y)<260)continue;
   if(Math.hypot(x-CABIN.x,y-CABIN.y)<170)continue;
   if(Math.hypot(x-SHOTGUN_POS.x,y-SHOTGUN_POS.y)<110)continue;
   if(nearHut(x,y,380))continue;
   if(Math.hypot(x-TABLET_POS.x,y-TABLET_POS.y)<200)continue;
   if(!far(x,y,placed,minSpacing))continue;
   return {x:x,y:y};
  }
  return {x:600+Math.random()*400,y:900+Math.random()*400};
 }
 var i;
 for(i=0;i<cluesData.length;i++){
  var cd=cluesData[i];
  var p=(cd.k==='note')?{x:NOTE_POS.x,y:NOTE_POS.y}:tryPlace(230);
  placed.push(p);
  clues.push({x:p.x,y:p.y,t:cd.t,t2:cd.t2,te:cd.te,t2e:cd.t2e,k:cd.k,ammo:!!cd.ammo,got:false});
 }
 for(i=0;i<5;i++){var p2=tryPlace(240);placed.push(p2);crates.push({x:p2.x,y:p2.y,got:false});}
 crates.push({x:CAR_CRATE.x,y:CAR_CRATE.y,got:false});
 var ps=tryPlace(240);placed.push(ps);
 shells={x:ps.x,y:ps.y,got:false};
 for(i=0;i<3;i++){var pt=tryPlace(320);placed.push(pt);targets.push({x:pt.x,y:pt.y,hit:false});}
}

(function setupTouch(){
 var joyL=document.getElementById('tJoyL'),knobL=document.getElementById('tJoyLKnob');
 var joyR=document.getElementById('tJoyR'),knobR=document.getElementById('tJoyRKnob');
 if(isTouchDevice()){touchAim.active=true;touchAim.angle=0;mouse.x=W/2+150;mouse.y=H/2;}
 function bindStick(base,knob,radius,onMove,onEnd){
  var id=null;
  function center(){var r=base.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
  function start(e){
   if(id!==null)return;
   var t=e.changedTouches[0];id=t.identifier;
   handle(t);
   e.preventDefault();
  }
  function handle(t){
   var c=center();
   var dx=t.clientX-c.x,dy=t.clientY-c.y,d=Math.hypot(dx,dy);
   var cl=Math.min(d,radius);
   var nx=d>0?dx/d*cl:0,ny=d>0?dy/d*cl:0;
   knob.style.transform='translate('+nx+'px,'+ny+'px)';
   onMove(dx/radius,dy/radius,d/radius);
  }
  function move(e){
   for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===id){handle(t);e.preventDefault();break;}
   }
  }
  function end(e){
   for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===id){
     id=null;knob.style.transform='translate(0,0)';onEnd();e.preventDefault();break;
    }
   }
  }
  base.addEventListener('touchstart',start,{passive:false});
  addEventListener('touchmove',move,{passive:false});
  addEventListener('touchend',end,{passive:false});
  addEventListener('touchcancel',end,{passive:false});
 }
 bindStick(joyL,knobL,42,function(nx,ny){
  touchMove.active=true;
  var m=Math.min(1,Math.hypot(nx,ny));
  var a=Math.atan2(ny,nx);
  touchMove.x=Math.cos(a)*m;touchMove.y=Math.sin(a)*m;
 },function(){touchMove.active=false;touchMove.x=0;touchMove.y=0;});
 bindStick(joyR,knobR,38,function(nx,ny,m){
  if(m>0.12){
   touchAim.active=true;touchAim.angle=Math.atan2(ny,nx);
   mouse.x=W/2+Math.cos(touchAim.angle)*150;
   mouse.y=H/2+Math.sin(touchAim.angle)*150;
  }
 },function(){});
 function btn(id,fn){
  var el=document.getElementById(id);
  el.addEventListener('touchstart',function(e){e.preventDefault();fn();},{passive:false});
  el.addEventListener('click',fn);
 }
 function holdBtn(id,onDown,onUp){
  var el=document.getElementById(id);
  el.addEventListener('touchstart',function(e){e.preventDefault();onDown();},{passive:false});
  el.addEventListener('touchend',function(e){e.preventDefault();onUp();},{passive:false});
  el.addEventListener('touchcancel',function(e){onUp();},{passive:false});
  el.addEventListener('mousedown',function(e){e.preventDefault();onDown();});
  el.addEventListener('mouseup',onUp);
  el.addEventListener('mouseleave',onUp);
 }
 btn('tBtnE',function(){if(mode==='play')tryInteract();});
 btn('tBtnR',function(){if(mode==='play')reload();});
 btn('tBtnQ',function(){if(mode==='play')fireShotgun();});
 btn('tBtnF',function(){if(mode==='play'&&P){P.flash=!P.flash;if(AC)tone(1400,0.03,0.08,'square');}});
 btn('tBtnG',function(){throwGrenade();});
 btn('tBtnU',function(){activateRadar();});
 btn('tBtnEsc',function(){if(mode==='play')pauseGame();else if(mode==='paused')unpause();});
 holdBtn('tBtnFire',function(){touchFire=true;},function(){touchFire=false;});
})();

function emitNoise(x,y,r){
 if(!K||!K.active||K.stun>0)return;
 var d=Math.hypot(K.x-x,K.y-y);
 if(d<r){
  var loud=r-d;
  if(K.state!=='chase'){K.state='investigate';K.tx=x;K.ty=y;}
  K.aware=Math.min(140,K.aware+(loud>150?42:20));
 }
}
function moveKiller(tx,ty,sp,dt){
 var dx=tx-K.x,dy=ty-K.y;var dd=Math.hypot(dx,dy);
 if(dd<3)return;
 dx/=dd;dy/=dd;
 for(var i=0;i<trees.length;i++){
  var t=trees[i];
  var ax=K.x-t.x,ay=K.y-t.y;var d2=Math.hypot(ax,ay);
  if(d2<70&&d2>0.001){var f=(70-d2)/70*1.7;dx+=ax/d2*f;dy+=ay/d2*f;}
 }
 var l=Math.hypot(dx,dy)||1;
 K.x+=dx/l*sp*dt;K.y+=dy/l*sp*dt;
 K.head=angN(Math.atan2(dy,dx));
 collideEnt(K,15);
}
function updateKiller(dt){
 if(!K.active)return;
 if(K.slowT>0)K.slowT=Math.max(0,K.slowT-dt);
 var dx=P.x-K.x,dy=P.y-K.y,d=Math.hypot(dx,dy)||1;
 if(K.stun>0){
  K.stun-=dt;
  if(K.stun<=0){K.state='patrol';K.aware=0;K.reT=0;K.forced=false;K.berserk=false;K.slowT=2;}
  return;
 }
 if(d<24){die(K.berserk?'killerBerserk':'killer');return;}
 var dirA=Math.atan2(dy,dx);
 var vis=false;
 var viewR=(P.clues>=10?640:560)*(P.crouch?0.72:1);
 if(!P.hidden&&d<viewR&&(angDiff(dirA,K.head)<1.15||d<70)){
  if(losClear(K.x,K.y,P.x,P.y))vis=true;
 }
 var lit=false;
 if(P.flash&&d<520){
  var dot=(dx*Math.cos(P.a)+dy*Math.sin(P.a))/(d||1);
  if(dot>0.86&&losClear(K.x,K.y,P.x,P.y))lit=true;
 }
 if(lit){
  K.aware=Math.min(140,K.aware+dt*140);
  if(K.state!=='chase')K.head+=angN(dirA-K.head)*Math.min(1,dt*2.5);
 }
 if(vis)K.aware+=dt*(d<220?150:(d<380?85:45));
 else K.aware=Math.max(0,K.aware-dt*22);
 if(K.aware>=100&&K.state!=='chase'){
  K.state='chase';K.lost=0;sfx.sting();camShake=Math.max(camShake,0.5);
  centerFlash(L('ОН ТЕБЯ УВИДЕЛ. БЕГИ!','IT SAW YOU. RUN!'),2.5);
 }
 var spdMul=(K.slowT>0?0.75:1)*(K.berserk?2:1);
 if(K.state==='patrol'){
  K.reT-=dt;
  if(K.reT<=0||Math.hypot(K.tx-K.x,K.ty-K.y)<18){
   K.tx=200+Math.random()*(WORLD-400);K.ty=560+Math.random()*(WORLD-660);K.reT=7+Math.random()*5;
  }
  moveKiller(K.tx,K.ty,66*spdMul,dt);
 }else if(K.state==='investigate'){
  if(Math.hypot(K.tx-K.x,K.ty-K.y)<26){K.state='search';K.seekT=4;K.lx=K.tx;K.ly=K.ty;K.wT=0;}
  moveKiller(K.tx,K.ty,150*spdMul,dt);
 }else if(K.state==='search'){
  K.seekT-=dt;K.wT-=dt;
  if(K.wT<=0){K.wT=1.4;K.tx=K.lx+(Math.random()-0.5)*280;K.ty=K.ly+(Math.random()-0.5)*260;}
  moveKiller(K.tx,K.ty,115*spdMul,dt);
  if(K.seekT<=0)K.state='patrol';
 }else if(K.state==='chase'){
  if(vis||K.forced){K.lost=0;K.lx=P.x;K.ly=P.y;}
  var tx=(vis||K.forced)?P.x:K.lx,ty=(vis||K.forced)?P.y:K.ly;
  moveKiller(tx,ty,(P.clues>=10?238:212)*spdMul,dt);
  if(!vis&&!K.forced){K.lost+=dt;if(K.lost>4){K.state='search';K.seekT=6;K.lx=tx;K.ly=ty;K.wT=0;}}
  if(d<340)K.head=angN(dirA);
 }
 if(!vis&&d<330&&P.sprint)K.aware=Math.min(140,K.aware+dt*35);
 K.stepT-=dt;
 if(K.stepT<=0&&d<620){
  K.stepT=(K.state==='chase')?0.3:0.55;
  sfx.kstep(Math.max(0.02,0.3*(1-d/600)));
 }
}
function updatePlayer(dt){
 var ax,ay;
 if(touchMove.active){ax=touchMove.x;ay=touchMove.y;}
 else{
  ax=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  ay=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
 }
 var mv=Math.hypot(ax,ay),dx=0,dy=0,moveScale=1;
 if(mv>0){dx=ax/mv;dy=ay/mv;moveScale=Math.min(mv,1);}
 P.crouch=!!(keys.ControlLeft||keys.ControlRight||keys.KeyC);
 var wantSprint=touchMove.active?(moveScale>0.82&&!P.crouch&&mv>0&&!P.exh&&P.stam>0):
  ((keys.ShiftLeft||keys.ShiftRight)&&!P.crouch&&mv>0&&!P.exh&&P.stam>0);
 P.sprint=wantSprint;
 if(wantSprint){P.stam-=30*dt;if(P.stam<=0)P.exh=true;}
 else{P.stam=Math.min(100,P.stam+15*dt);if(P.stam>30)P.exh=false;}
 var spd=P.crouch?72:(wantSprint?250:132);
 if(P.speedBoostT>0){P.speedBoostT=Math.max(0,P.speedBoostT-dt);spd*=1.3;}
 P.x+=dx*spd*dt*moveScale;P.y+=dy*spd*dt*moveScale;
 collideEnt(P,13);
 if(touchAim.active){P.a=touchAim.angle;}
 else{var wx=cam.x-W/2+mouse.x,wy=cam.y-H/2+mouse.y;P.a=Math.atan2(wy-P.y,wx-P.x);}
 P.hidden=false;
 if(P.crouch&&!P.flash){
  for(var i=0;i<bushes.length;i++){if(Math.hypot(bushes[i].x-P.x,bushes[i].y-P.y)<bushes[i].r){P.hidden=true;break;}}
 }
 if(mv>0){
  P.stepT+=dt;
  if(P.stepT>(P.crouch?0.6:(P.sprint?0.27:0.42))){
   P.stepT=0;
   sfx.step(P.crouch?0.04:(P.sprint?0.2:0.1));
   emitNoise(P.x,P.y,P.crouch?45:(P.sprint?270:130));
  }
 }
 P.cd=Math.max(0,P.cd-dt);P.sgcd=Math.max(0,P.sgcd-dt);
 if((mouse.l||touchFire)&&P.cd<=0)firePistol();
 if(mouse.r&&P.sgcd<=0&&P.hasShotgun)fireShotgun();
}
function update(dt){
 stats.t+=dt;
 if(!K.active&&P.clues<4&&stats.t>=150)spawnKiller();
 updatePlayer(dt);
 updateKiller(dt);
 if(noteState.open){
  if(noteState.chars<noteState.text.length){
   noteState.chars=Math.min(noteState.text.length,noteState.chars+dt*noteState.speed);
   noteTextEl.textContent=noteState.text.slice(0,Math.floor(noteState.chars));
  }
  noteState.closeT-=dt;
  if(noteState.closeT<=0)hideNote();
 }
 if(msgT>0){msgT-=dt;if(msgT<=0)centerEl.style.opacity='0';}
 var ns=[];
 for(var s=0;s<sparks.length;s++){
  var sp=sparks[s];sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.t-=dt;
  if(sp.t>0)ns.push(sp);
 }
 sparks=ns;
 for(var ff=0;ff<fireflies.length;ff++){
  var fl=fireflies[ff];fl.ph+=dt;
  fl.x+=Math.cos(fl.ph*0.53)*14*dt;fl.y+=Math.sin(fl.ph*0.61)*14*dt;
 }
 for(var fg=0;fg<fog.length;fg++){
  var fb=fog[fg];
  fb.x+=fb.vx*dt;fb.y+=fb.vy*dt;
  if(fb.x<-300)fb.x=WORLD+280;if(fb.x>WORLD+300)fb.x=-280;
  if(fb.y<-300)fb.y=WORLD+280;if(fb.y>WORLD+300)fb.y=-280;
 }
 cam.x+=(P.x-cam.x)*Math.min(1,dt*6);
 cam.y+=(P.y-cam.y)*Math.min(1,dt*6);
 cam.x=clamp(cam.x,Math.min(W/2,WORLD/2),Math.max(W/2,WORLD-W/2));
 cam.y=clamp(cam.y,Math.min(H/2,WORLD/2),Math.max(H/2,WORLD-H/2));
 if(AC){
  windT-=dt;
  if(windT<=0){windT=2.5+Math.random()*3;windG.gain.linearRampToValueAtTime(0.02+Math.random()*0.05,AC.currentTime+1.8);}
 }
 owlT-=dt;if(owlT<=0){owlT=14+Math.random()*20;if(!K.active)sfx.owl();}
 crackT-=dt;if(crackT<=0){crackT=9+Math.random()*15;sfx.crack();}
 fx.lt-=dt;
 if(fx.lt<=0){fx.ltA=0.55;fx.lt=18+Math.random()*22;if(AC)setTimeout(function(){sfx.thunder();},400+Math.random()*900);}
 fx.ltA=Math.max(0,fx.ltA-dt*1.3);
 fx.muzzle=Math.max(0,fx.muzzle-dt);
 if(Q==='quake'||Q==='boss'){
  if(droneG)droneG.gain.value=0.15+0.05*Math.sin(gTime*5);
  bossPulse(dt);
 }else if(K.active){
  var kd=Math.hypot(K.x-P.x,K.y-P.y);
  hbT-=dt;
  if(hbT<=0&&kd<620&&K.stun<=0){
   hbT=0.34+(kd/620)*0.75;
   sfx.heartbeat(Math.max(0.12,0.5-(kd/620)*0.4));
  }
  var tgt=(K.state==='chase')?1:((K.state==='search')?0.35:0.05);
  chaseMix+=(tgt-chaseMix)*Math.min(1,dt*2);
  if(droneG)droneG.gain.value=chaseMix*0.11;
 }else{
  chaseMix*=1-Math.min(1,dt*2);
  if(droneG)droneG.gain.value=chaseMix*0.09;
 }
 updateBullets(dt);
 updateGrenade(dt);
 if(Q==='quake'){
  quakeT+=dt;
  camShake=Math.max(camShake,0.35+0.35*Math.abs(Math.sin(gTime*9)));
  if(Math.floor(quakeT*3)!==Math.floor((quakeT-dt)*3))sfx.quake();
  bearSpawnT-=dt;
  if(bearSpawnT<=0){Q='boss';spawnBear();}
 }else if(Q==='boss'){
  updateBear(dt);
  updateWolves(dt);

function updateBullets(dt){
 var ns=[];
 for(var i=0;i<bullets.length;i++){
  var b=bullets[i];
  b.px=b.x;b.py=b.y;
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.dist+=Math.hypot(b.vx*dt,b.vy*dt);
  var dead=false;
  for(var j=0;j<trees.length;j++){
   var t=trees[j];
   if(Math.hypot(t.x-b.x,t.y-b.y)<t.r){
    for(var s=0;s<4;s++)sparks.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*70,vy:(Math.random()-0.5)*80,t:0.18,c:'#8a8f96'});
    dead=true;break;
   }
  }
  if(!dead&&K.active&&K.stun<=0&&Math.hypot(K.x-b.x,K.y-b.y)<16){
   for(var s2=0;s2<6;s2++)sparks.push({x:K.x,y:K.y,vx:(Math.random()-0.5)*90,vy:(Math.random()-0.5)*90,t:0.25,c:'#ffd77a'});
   K.aware=Math.min(140,K.aware+70);
   if(!K.shotMsg){K.shotMsg=true;centerFlash(L('ПУЛИ ПРОХОДЯТ СКВОЗЬ НЕГО. ОН НЕ ОСТАНАВЛИВАЕТСЯ.','BULLETS PASS THROUGH IT. IT DOES NOT STOP.'),3.2);}
   dead=true;
  }
  if(!dead&&bulletHitTarget(b.x,b.y))dead=true;
  if(!dead&&bulletHitBear(b.x,b.y,b.dmg))dead=true;
  if(!dead&&bulletHitWolf(b.x,b.y,b.dmg))dead=true;
  if(!dead&&b.dist<b.maxDist)ns.push(b);
 }
 bullets=ns;
}

 }
 if(!hit)centerFlash(L('МИМО','MISS'),1);
 updHUD();
}

function updateCat(dt){
 var c=catState;if(!c||!c.started||!c.alive)return;
 c.vy+=820*dt;c.y+=c.vy*dt;
 if(c.y<10){c.y=10;c.vy=0;}
 if(c.y>510){c.alive=false;sfx.splat();return;}
 c.spawnT-=dt;
 if(c.spawnT<=0){
  c.spawnT=1.6;
  var gapY=100+Math.random()*320;
  c.walls.push({x:330,gapY:gapY,gapH:120,w:34});
  if(Math.random()<0.85)c.fish.push({x:347,y:gapY,got:false});
 }
 var i;
 for(i=c.walls.length-1;i>=0;i--){
  var wl=c.walls[i];wl.x-=140*dt;
  if(wl.x<-40)c.walls.splice(i,1);
  else if(wl.x<62&&wl.x+wl.w>38){
   if(c.y-12<wl.gapY-wl.gapH/2||c.y+12>wl.gapY+wl.gapH/2){c.alive=false;sfx.splat();}
  }
 }
 for(i=c.fish.length-1;i>=0;i--){
  var f=c.fish[i];f.x-=140*dt;
  if(f.x<-20){c.fish.splice(i,1);continue;}
  if(Math.hypot(f.x-50,f.y-c.y)<17){
   c.fish.splice(i,1);c.score++;sfx.fish();
   c.eatT=0.35;
   for(var ci=0;ci<5;ci++)c.crumbs.push({x:f.x,y:f.y,vx:(Math.random()-0.5)*60,vy:-30-Math.random()*40,t:0.5});
   if(c.score>=5)unlockAch('potap');
  }
 }
 if(c.eatT>0)c.eatT=Math.max(0,c.eatT-dt);
 for(i=c.crumbs.length-1;i>=0;i--){
  var cr=c.crumbs[i];cr.x+=cr.vx*dt;cr.y+=cr.vy*dt;cr.vy+=260*dt;cr.t-=dt;
  if(cr.t<=0)c.crumbs.splice(i,1);
 }
}

function drawClues(){
 for(var i=0;i<clues.length;i++){
  var c=clues[i];
  if(c.got&&c.k!=='blood'&&c.k!=='body'&&c.k!=='marks')continue;
  if(c.x<view.x0-40||c.x>view.x1+40||c.y<view.y0-40||c.y>view.y1+40)continue;
  var p=0.5+0.5*Math.sin(gTime*2.4+i*1.3);
  if(!c.got){
   ctx.strokeStyle='rgba(170,220,150,'+(0.15+0.3*p).toFixed(2)+')';
   ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(c.x,c.y,13+4*p,0,TAU);ctx.stroke();

 ctx.moveTo(3,9);ctx.lineTo(3+22*swing,17+4*swing);ctx.stroke();
 ctx.fillStyle=K.berserk?'#7a1414':'#3a3630';
 ctx.beginPath();ctx.arc(3+22*swing,-17-4*swing,2.6,0,TAU);ctx.arc(3+22*swing,17+4*swing,2.6,0,TAU);ctx.fill();
 ctx.fillStyle='#b3ab9d';
 ctx.beginPath();ctx.arc(6,0,7,0,TAU);ctx.fill();
 ctx.fillStyle='#050506';
 ctx.beginPath();ctx.ellipse(2,0,12,8.5,0,0,TAU);ctx.fill();
 ctx.fillStyle='#0a0a0c';
 ctx.beginPath();ctx.arc(7,0,5,0,TAU);ctx.fill();
 ctx.restore();
}
function drawLights(shx,shy){
 var dark=0.83+(K.active?0.025:0)+((K.active&&K.state==='chase')?0.02:0);
 dark=Math.min(0.90,dark)*(1-fx.ltA*0.85);
 lctx.setTransform(1,0,0,1,0,0);
 lctx.globalCompositeOperation='source-over';
 lctx.clearRect(0,0,W,H);
 lctx.fillStyle='rgba(2,4,9,'+dark.toFixed(3)+')';
 lctx.fillRect(0,0,W,H);
 lctx.save();
 lctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 lctx.globalCompositeOperation='destination-out';
 hole(cam.x,cam.y,Math.max(W,H)*0.8,0.17);
 hole(P.x,P.y,58,0.42);
 if(P.flash){
  var g=lctx.createRadialGradient(P.x,P.y,26,P.x,P.y,480);
  g.addColorStop(0,'rgba(0,0,0,1)');
  g.addColorStop(0.65,'rgba(0,0,0,0.72)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  lctx.fillStyle=g;
  lctx.beginPath();lctx.moveTo(P.x,P.y);
  lctx.arc(P.x,P.y,480,P.a-0.58,P.a+0.58);
  lctx.closePath();lctx.fill();
 }
 if(K.active&&K.stun<=0){
  var kg=lctx.createRadialGradient(K.x,K.y,10,K.x,K.y,240);
  kg.addColorStop(0,'rgba(0,0,0,0.6)');
  kg.addColorStop(1,'rgba(0,0,0,0)');
  lctx.fillStyle=kg;
  lctx.beginPath();lctx.moveTo(K.x,K.y);
  lctx.arc(K.x,K.y,240,K.head-0.42,K.head+0.42);
  lctx.closePath();lctx.fill();
 }
 hole(CAR.x,CAR.y,110,0.5);
 var bph=Math.sin(gTime*4);
 hole(CAR.x-14,CAR.y,58+8*bph,0.25+0.25*Math.max(0,bph));
 hole(CAR.x+14,CAR.y,58+8*Math.max(0,-bph),0.25+0.25*Math.max(0,-bph));
 if(Q!=='hunt')hole(CABIN.x-58,CABIN.y-8,150+Math.sin(gTime*9)*12,0.8);
 var i;
 for(i=0;i<clues.length;i++){
  if(!clues[i].got)hole(clues[i].x,clues[i].y,30,0.22+0.1*Math.sin(gTime*2.4+i));
 }
 if(!shotgun.got)hole(shotgun.x,shotgun.y,26,0.22);
 for(i=0;i<crates.length;i++)if(!crates[i].got)hole(crates[i].x,crates[i].y,26,0.22);
 for(i=0;i<bearCrates.length;i++)if(!bearCrates[i].got)hole(bearCrates[i].x,bearCrates[i].y,26,0.22);
 for(i=0;i<bearShells.length;i++)if(!bearShells[i].got)hole(bearShells[i].x,bearShells[i].y,24,0.2);
 if(shells&&!shells.got)hole(shells.x,shells.y,24,0.2);
 for(i=0;i<targets.length;i++)if(!targets[i].hit)hole(targets[i].x,targets[i].y,26,0.18);
 if(grenadeItem&&!grenadeItem.got)hole(grenadeItem.x,grenadeItem.y,22,0.22);
 if(figurineVisible&&!haveFigurine)hole(FIGURINE_POS.x,FIGURINE_POS.y,26,0.24+0.1*Math.sin(gTime*2.6));
 if(clawItem&&!clawItem.got)hole(clawItem.x,clawItem.y,24,0.24);
 if(!tabletOpen)hole(TABLET_POS.x,TABLET_POS.y,50,0.4+0.15*Math.sin(gTime*3));
 if(fx.muzzle>0)hole(fx.mx,fx.my,170,Math.min(1,fx.muzzle*7));
 if(K.active&&K.stun>0)hole(K.x,K.y,70,0.5);
 if(bear&&bear.active)hole(bear.x,bear.y,46,0.3);
 if(torchLit)for(i=0;i<TORCHES.length;i++)hole(TORCHES[i].x,TORCHES[i].y-10,280+Math.sin(gTime*11+i)*18,0.78);
 for(i=0;i<fireflies.length;i++){
  var f=fireflies[i];
  hole(f.x,f.y,22,0.28+0.22*Math.sin(gTime*3+f.ph));
 }
 if(fx.ltA>0){
  lctx.fillStyle='rgba(0,0,0,'+(fx.ltA*0.9).toFixed(3)+')';
  lctx.fillRect(cam.x-W/2-100,cam.y-H/2-100,W+200,H+200);
 }
 lctx.restore();
 ctx.save();
 ctx.setTransform(1,0,0,1,0,0);
 ctx.drawImage(lcv,0,0);
 ctx.restore();
}
function drawGlows(shx,shy){
 ctx.save();
 ctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 ctx.globalCompositeOperation='lighter';
 var i;
 if(fx.muzzle>0)glowC(fx.mx,fx.my,130,'rgba(255,235,170,'+Math.min(0.7,fx.muzzle*5).toFixed(3)+')');
 glowC(CAR.x-14,CAR.y,26,'rgba(255,70,70,'+(0.1+0.16*Math.max(0,Math.sin(gTime*4))).toFixed(3)+')');
 glowC(CAR.x+14,CAR.y,26,'rgba(80,140,255,'+(0.1+0.16*Math.max(0,-Math.sin(gTime*4))).toFixed(3)+')');
 if(Q!=='hunt')glowC(CABIN.x-58,CABIN.y-8,55,'rgba(255,215,140,'+(0.18+0.06*Math.sin(gTime*9)).toFixed(3)+')');
 if(P.clues>=10)glowC(CAR.x,CAR.y,140+70*(0.5+0.5*Math.sin(gTime*3)),'rgba(255,215,120,'+(0.06+0.08*(0.5+0.5*Math.sin(gTime*3))).toFixed(3)+')');
 for(i=0;i<clues.length;i++){
  var c=clues[i];
  if(c.got)continue;
  var col=null;
  if(c.k==='phone')col='125,220,255';
  if(c.k==='gps')col='125,235,140';
  if(c.k==='tape')col='255,110,90';
  if(col)glowC(c.x,c.y,16,'rgba('+col+','+(0.3+0.25*Math.sin(gTime*3+i)).toFixed(3)+')');
 }
 for(i=0;i<fireflies.length;i++){
  var f=fireflies[i];
  var fa=0.3+0.3*Math.sin(gTime*2.6+f.ph);
  glowC(f.x,f.y,10,'rgba(190,255,180,'+Math.max(0,fa).toFixed(3)+')');
 }
 if(torchLit)for(i=0;i<TORCHES.length;i++){
  var tt=TORCHES[i];
  glowC(tt.x,tt.y-10,150+10*Math.sin(gTime*13+i),'rgba(255,150,50,'+(0.4+0.15*Math.sin(gTime*17+i)).toFixed(3)+')');
 }
 if(K.active&&K.stun<=0){
  ctx.save();
  ctx.translate(K.x,K.y);ctx.rotate(K.head);
  var kcg=ctx.createRadialGradient(0,0,8,0,0,240);
  kcg.addColorStop(0,'rgba(255,225,110,0.32)');
  kcg.addColorStop(0.6,'rgba(255,205,80,0.14)');
  kcg.addColorStop(1,'rgba(255,190,60,0)');
  ctx.fillStyle=kcg;
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,240,-0.42,0.42);ctx.closePath();ctx.fill();
  ctx.restore();
 }
 if(!tabletOpen)glowC(TABLET_POS.x,TABLET_POS.y,26,'rgba(150,220,255,'+(0.35+0.2*Math.sin(gTime*3)).toFixed(2)+')');
 if(bear&&bear.active){
  glowC(bear.x+Math.cos(bear.head)*20,bear.y+Math.sin(bear.head)*6,14,'rgba(255,40,20,'+(0.4+0.25*Math.sin(gTime*8)).toFixed(3)+')');
 }
 if(K.active){
  var ex=K.x+Math.cos(K.head)*8,ey=K.y+Math.sin(K.head)*8;
  var ox=Math.cos(K.head+Math.PI/2)*2.6,oy=Math.sin(K.head+Math.PI/2)*2.6;
  var ec=(K.stun>0)?'255,215,120':(K.berserk?'255,120,20':'255,45,45');
  var ea=(K.stun>0)?(0.3+0.3*Math.sin(gTime*15)):(K.berserk?(0.7+0.3*Math.sin(gTime*20)):(0.5+0.4*chaseMix));
  glowC(ex,ey,K.berserk?22:15,'rgba('+ec+','+Math.max(0,ea).toFixed(3)+')');
  ctx.fillStyle='rgba('+ec+',0.95)';
  ctx.beginPath();ctx.arc(ex+ox,ey+oy,1.8,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(ex-ox,ey-oy,1.8,0,TAU);ctx.fill();
 }
 for(i=0;i<sparks.length;i++){
  var sp=sparks[i];
  ctx.globalAlpha=Math.min(1,sp.t*4);
  ctx.fillStyle=sp.c;
  ctx.beginPath();ctx.arc(sp.x,sp.y,2.2,0,TAU);ctx.fill();
 }
 ctx.globalAlpha=1;
 drawSnipeDot();
 ctx.restore();
}
function drawFogWorld(shx,shy){
 ctx.save();
 ctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 for(var i=0;i<fog.length;i++){
  var f=fog[i];
  if(f.x<view.x0-100||f.x>view.x1+100||f.y<view.y0-100||f.y>view.y1+100)continue;
  var fa=0.035+fogN*0.05;
  var g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
  g.addColorStop(0,'rgba(155,165,160,'+fa.toFixed(3)+')');
  g.addColorStop(1,'rgba(155,165,160,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill();
 }
 ctx.restore();
}
function drawVignette(){
 var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,Math.max(W,H)*0.72);
 vg.addColorStop(0,'rgba(0,0,0,0)');
 vg.addColorStop(1,'rgba(0,0,0,0.6)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 if(fx.ltA>0){
  ctx.fillStyle='rgba(205,218,255,'+(fx.ltA*0.3).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
 }
 if(chaseMix>0.02){
  var rg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);
  var ra=Math.max(0,(0.09+0.06*Math.sin(gTime*6))*chaseMix);
  rg.addColorStop(0,'rgba(140,10,10,0)');
  rg.addColorStop(1,'rgba(150,15,15,'+ra.toFixed(3)+')');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
 }
 if(hurtFlashT>0){
  ctx.fillStyle='rgba(200,20,20,'+(hurtFlashT/0.4*0.35).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
 }
}
function drawMinimap(){
 var ms=150,mx0=W-ms-16,my0=14,sc=ms/WORLD;
 ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(mx0,my0,ms,ms);
 ctx.fillStyle='#1c2126';ctx.fillRect(mx0,my0,ms,RY1*sc);
 ctx.strokeStyle='#3c4450';ctx.lineWidth=1;ctx.strokeRect(mx0+0.5,my0+0.5,ms-1,ms-1);
 for(var i=0;i<clues.length;i++){
  var c=clues[i];
  if(c.got){
   ctx.fillStyle='#39412f';ctx.fillRect(mx0+c.x*sc-1.5,my0+c.y*sc-1.5,3,3);
  }else if(Math.hypot(c.x-P.x,c.y-P.y)<330){
   ctx.fillStyle='rgba(255,205,95,'+(0.35+0.35*Math.sin(gTime*6)).toFixed(2)+')';
   ctx.beginPath();ctx.arc(mx0+c.x*sc,my0+c.y*sc,2.4,0,TAU);ctx.fill();
  }
 }
 if(radarActive){
  var nd=1e18,nc=null;
  for(var ri=0;ri<clues.length;ri++){if(!clues[ri].got){var rdd=Math.hypot(clues[ri].x-P.x,clues[ri].y-P.y);if(rdd<nd){nd=rdd;nc=clues[ri];}}}
  if(nc){
   var rph=(radarT%1);
   ctx.strokeStyle='rgba(255,60,50,'+(0.7*(1-rph)).toFixed(2)+')';ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(mx0+nc.x*sc,my0+nc.y*sc,3+rph*10,0,TAU);ctx.stroke();
   ctx.fillStyle='#ff3a2a';
   ctx.beginPath();ctx.arc(mx0+nc.x*sc,my0+nc.y*sc,2.6,0,TAU);ctx.fill();
  }
 }
 ctx.fillStyle='#5aa2ff';ctx.fillRect(mx0+CAR.x*sc-3,my0+CAR.y*sc-2,6,4);
 if(bear&&bear.active){
  ctx.fillStyle='#ff8a3a';
  ctx.beginPath();ctx.arc(mx0+bear.x*sc,my0+bear.y*sc,2.6,0,TAU);ctx.fill();
 }
 if(K.active){
  var kd=Math.hypot(K.x-P.x,K.y-P.y);
  if((kd<420||K.state==='chase')&&Math.sin(gTime*9)>-0.4){
   ctx.fillStyle='#ff4040';
   ctx.beginPath();ctx.arc(mx0+K.x*sc,my0+K.y*sc,2.4,0,TAU);ctx.fill();
  }
 }
 ctx.fillStyle='#fff';
 ctx.beginPath();ctx.arc(mx0+P.x*sc,my0+P.y*sc,2.4,0,TAU);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,0.6)';
 ctx.beginPath();ctx.moveTo(mx0+P.x*sc,my0+P.y*sc);
 ctx.lineTo(mx0+(P.x+Math.cos(P.a)*26)*sc,my0+(P.y+Math.sin(P.a)*26)*sc);
 ctx.stroke();
 ctx.font='11px monospace';ctx.textAlign='right';
 if(radarActive){ctx.fillStyle='#ff5a4a';ctx.fillText('U · RADAR '+Math.ceil(radarT)+'s',mx0+ms,my0+ms+15);}
 else if(radarCD>0){ctx.fillStyle='#6d7a63';ctx.fillText('U · '+Math.ceil(radarCD)+'s',mx0+ms,my0+ms+15);}
 else{ctx.fillStyle='#9fb08a';ctx.fillText('U · '+L('РАДАР','RADAR'),mx0+ms,my0+ms+15);}
 ctx.textAlign='left';
}
function drawCrosshair(){
 var touchy=document.body.classList.contains('touch');
 var rad=touchy?8:5,tick0=touchy?13:10,tick1=touchy?9:6;
 ctx.strokeStyle=touchy?'rgba(255,210,180,0.75)':'rgba(255,255,255,0.55)';
 ctx.lineWidth=touchy?2:1.3;
 ctx.beginPath();ctx.arc(mouse.x,mouse.y,rad,0,TAU);ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(mouse.x-tick0,mouse.y);ctx.lineTo(mouse.x-tick1,mouse.y);
 ctx.moveTo(mouse.x+tick1,mouse.y);ctx.lineTo(mouse.x+tick0,mouse.y);
 ctx.moveTo(mouse.x,mouse.y-tick0);ctx.lineTo(mouse.x,mouse.y-tick1);
 ctx.moveTo(mouse.x,mouse.y+tick1);ctx.lineTo(mouse.x,mouse.y+tick0);
 ctx.stroke();
 if(touchy){
  ctx.fillStyle='rgba(255,150,110,0.85)';
  ctx.beginPath();ctx.arc(mouse.x,mouse.y,2,0,TAU);ctx.fill();
 }
}
function render(){
 if(!P)return;
 var shx=(Math.random()-0.5)*camShake*14,shy=(Math.random()-0.5)*camShake*12;
 view.x0=cam.x-W/2-120;view.y0=cam.y-H/2-120;
 view.x1=cam.x+W/2+120;view.y1=cam.y+H/2+120;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.fillStyle='#04070a';ctx.fillRect(0,0,W,H);
 ctx.save();
 ctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 drawGround();
 drawRoad();
 drawTrails();
 drawClues();
 drawItems();
 drawTargets();
 drawQuestPickups();
 drawCabin();
 drawHut2();
 drawTorches();
 drawCar();
 drawTrees();
 drawRanger();
 drawBear();
 drawWolves();
 drawTabletItem();
 drawKiller();
 drawBullets();
 drawFlyingGrenade();
 drawPlayer();
 drawBushes();
 ctx.globalCompositeOperation='lighter';
 for(var s=0;s<sparks.length;s++){
  ctx.globalAlpha=Math.min(1,sparks[s].t*4);
  ctx.fillStyle=sparks[s].c;
  ctx.beginPath();ctx.arc(sparks[s].x,sparks[s].y,2.2,0,TAU);ctx.fill();
 }
 ctx.globalAlpha=1;
 ctx.globalCompositeOperation='source-over';
 ctx.restore();
 drawLights(shx,shy);
 drawGlows(shx,shy);
 drawFogWorld(shx,shy);
 ctx.setTransform(1,0,0,1,0,0);
 drawVignette();
 drawMinimap();
 drawCrosshair();
}
function loop(now){
 var dt=(now-last)/1000;last=now;
 if(!(dt>0)||dt>0.05)dt=0.016;
 gTime+=dt;
 if(mode==='play'){
  if(tabletOpen)updateTabletOnly(dt);
  else update(dt);
 }
 if(W>0&&H>0)render();
 if(tabletOpen&&phoneApp==='herocat')drawCat();
 requestAnimationFrame(loop);
}
reset();
menuInit();
requestAnimationFrame(loop);
})();
</script>
