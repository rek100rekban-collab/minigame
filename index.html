function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function angN(a){a%=TAU;if(a>Math.PI)a-=TAU;if(a<-Math.PI)a+=TAU;return a;}
function angDiff(a,b){return Math.abs(angN(a-b));}
function far(x,y,arr,d){for(var i=0;i<arr.length;i++){if(Math.hypot(arr[i].x-x,arr[i].y-y)<d)return false;}return true;}
function segCircle(x1,y1,x2,y2,cx,cy,r){
 var dx=x2-x1,dy=y2-y1;var l2=dx*dx+dy*dy||1;
 var s=((cx-x1)*dx+(cy-y1)*dy)/l2;s=clamp(s,0,1);
 var px=x1+dx*s,py=y1+dy*s;
 return (cx-px)*(cx-px)+(cy-py)*(cy-py)<r*r;
}
function losClear(x1,y1,x2,y2){
 for(var i=0;i<trees.length;i++){
  var t=trees[i];
  if(segCircle(x1,y1,x2,y2,t.x,t.y,t.r*0.85))return false;
 }
 return true;
}
function collideEnt(o,r){
 for(var i=0;i<trees.length;i++){
  var t=trees[i];
  var dx=o.x-t.x,dy=o.y-t.y;var d=Math.hypot(dx,dy);var rr=r+t.r;
  if(d<rr&&d>0.001){var p=(rr-d)/d;o.x+=dx/d*p;o.y+=dy/d*p;}
 }
 var cdx=o.x-CAR.x,cdy=o.y-CAR.y,cd=Math.hypot(cdx,cdy);
 if(cd<62&&cd>0.001){o.x+=cdx/cd*(62-cd);o.y+=cdy/cd*(62-cd);}
 o.x=clamp(o.x,30,WORLD-30);o.y=clamp(o.y,30,WORLD-30);
}

var AC=null,master=null,windG=null,droneG=null,noiseBuf=null;
function setVolume(v){
 save.vol=clamp(v,0,1);writeSave();
 if(master)master.gain.value=save.vol;
}
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return;}
 var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
 AC=new A();
 master=AC.createGain();master.gain.value=save.vol;master.connect(AC.destination);
 noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
 var nd=noiseBuf.getChannelData(0);
 for(var i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 var ws=AC.createBufferSource();ws.buffer=noiseBuf;ws.loop=true;
 var wf=AC.createBiquadFilter();wf.type='lowpass';wf.frequency.value=260;
 windG=AC.createGain();windG.gain.value=0.03;
 ws.connect(wf);wf.connect(windG);windG.connect(master);ws.start();
 var o1=AC.createOscillator();o1.type='sawtooth';o1.frequency.value=47;
 var o2=AC.createOscillator();o2.type='sawtooth';o2.frequency.value=94.5;
 var df=AC.createBiquadFilter();df.type='lowpass';df.frequency.value=170;
 droneG=AC.createGain();droneG.gain.value=0;
 o1.connect(df);o2.connect(df);df.connect(droneG);droneG.connect(master);
 o1.start();o2.start();
}
function nz(dur,f0,f1,vol,type,q){
 if(!AC)return;
 var t=AC.currentTime;
 var s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
 var f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);
 if(f1)f.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
 f.Q.value=q||1;
 var g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(master);
 s.start(t);s.stop(t+dur+0.05);
}
function tone(fr,dur,vol,type,f1){
 if(!AC)return;var t=AC.currentTime;
 var o=AC.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(fr,t);
 if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
 var g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}

 function bindStick(base,knob,radius,onMove,onEnd){
  var id=null;
  function center(){var r=base.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
  function start(e){
   if(id!==null)return;
   var t=e.changedTouches[0];id=t.identifier;
   handle(t);
   e.preventDefault();
  }
  function handle(t){
   var c=center();
   var dx=t.clientX-c.x,dy=t.clientY-c.y,d=Math.hypot(dx,dy);
   var cl=Math.min(d,radius);
   var nx=d>0?dx/d*cl:0,ny=d>0?dy/d*cl:0;
   knob.style.transform='translate('+nx+'px,'+ny+'px)';
   onMove(dx/radius,dy/radius,d/radius);
  }
  function move(e){
   for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===id){handle(t);e.preventDefault();break;}
   }
  }
  function end(e){
   for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===id){
     id=null;knob.style.transform='translate(0,0)';onEnd();e.preventDefault();break;
    }
   }
  }
  base.addEventListener('touchstart',start,{passive:false});
  addEventListener('touchmove',move,{passive:false});
  addEventListener('touchend',end,{passive:false});
  addEventListener('touchcancel',end,{passive:false});
 }

function emitNoise(x,y,r){
 if(!K||!K.active||K.stun>0)return;
 var d=Math.hypot(K.x-x,K.y-y);
 if(d<r){
  var loud=r-d;
  if(K.state!=='chase'){K.state='investigate';K.tx=x;K.ty=y;}
  K.aware=Math.min(140,K.aware+(loud>150?42:20));
 }
}
function moveKiller(tx,ty,sp,dt){
 var dx=tx-K.x,dy=ty-K.y;var dd=Math.hypot(dx,dy);
 if(dd<3)return;
 dx/=dd;dy/=dd;
 for(var i=0;i<trees.length;i++){
  var t=trees[i];
  var ax=K.x-t.x,ay=K.y-t.y;var d2=Math.hypot(ax,ay);
  if(d2<70&&d2>0.001){var f=(70-d2)/70*1.7;dx+=ax/d2*f;dy+=ay/d2*f;}
 }
 var l=Math.hypot(dx,dy)||1;
 K.x+=dx/l*sp*dt;K.y+=dy/l*sp*dt;
 K.head=angN(Math.atan2(dy,dx));
 collideEnt(K,15);
}
function updateKiller(dt){
 if(!K.active)return;
 if(K.slowT>0)K.slowT=Math.max(0,K.slowT-dt);
 var dx=P.x-K.x,dy=P.y-K.y,d=Math.hypot(dx,dy)||1;
 if(K.stun>0){
  K.stun-=dt;
  if(K.stun<=0){
   if(DIFF().killerFollowAfterStun){K.state='chase';K.lost=0;}
   else{K.state='patrol';K.aware=0;K.reT=0;K.forced=false;}
   K.berserk=false;K.slowT=2;
  }
  return;
 }
 if(d<24){die(K.berserk?'killerBerserk':'killer');return;}
 var dirA=Math.atan2(dy,dx);
 var vis=false;
 var viewR=(P.clues>=10?640:560)*(P.crouch?0.72:1);
 if(!P.hidden&&d<viewR&&(angDiff(dirA,K.head)<1.15||d<70)){
  if(losClear(K.x,K.y,P.x,P.y))vis=true;
 }
 var lit=false;
 if(P.flash&&d<520){
  var dot=(dx*Math.cos(P.a)+dy*Math.sin(P.a))/(d||1);
  if(dot>0.86&&losClear(K.x,K.y,P.x,P.y))lit=true;
 }
 if(lit){
  K.aware=Math.min(140,K.aware+dt*140);
  if(K.state!=='chase')K.head+=angN(dirA-K.head)*Math.min(1,dt*2.5);
 }
 if(vis)K.aware+=dt*(d<220?150:(d<380?85:45));
 else K.aware=Math.max(0,K.aware-dt*22);
 if(K.aware>=100&&K.state!=='chase'){
  K.state='chase';K.lost=0;sfx.sting();camShake=Math.max(camShake,0.5);
  centerFlash(L('ОН ТЕБЯ УВИДЕЛ. БЕГИ!','IT SAW YOU. RUN!'),2.5);
 }
 var spdMul=(K.slowT>0?0.75:1)*(K.berserk?2:1)*DIFF().killerSpeedMul;
 if(K.state==='patrol'){
  K.reT-=dt;
  if(K.reT<=0||Math.hypot(K.tx-K.x,K.ty-K.y)<18){
   K.tx=200+Math.random()*(WORLD-400);K.ty=560+Math.random()*(WORLD-660);K.reT=7+Math.random()*5;
  }
  moveKiller(K.tx,K.ty,66*spdMul,dt);
 }else if(K.state==='investigate'){
  if(Math.hypot(K.tx-K.x,K.ty-K.y)<26){K.state='search';K.seekT=4;K.lx=K.tx;K.ly=K.ty;K.wT=0;}
  moveKiller(K.tx,K.ty,150*spdMul,dt);
 }else if(K.state==='search'){
  K.seekT-=dt;K.wT-=dt;
  if(K.wT<=0){K.wT=1.4;K.tx=K.lx+(Math.random()-0.5)*280;K.ty=K.ly+(Math.random()-0.5)*260;}
  moveKiller(K.tx,K.ty,115*spdMul,dt);
  if(K.seekT<=0)K.state='patrol';
 }else if(K.state==='chase'){
  if(vis||K.forced){K.lost=0;K.lx=P.x;K.ly=P.y;}
  var tx=(vis||K.forced)?P.x:K.lx,ty=(vis||K.forced)?P.y:K.ly;
  moveKiller(tx,ty,(P.clues>=10?238:212)*spdMul,dt);
  if(!vis&&!K.forced){K.lost+=dt;if(K.lost>4){K.state='search';K.seekT=6;K.lx=tx;K.ly=ty;K.wT=0;}}
  if(d<340)K.head=angN(dirA);
 }
 if(!vis&&d<330&&P.sprint)K.aware=Math.min(140,K.aware+dt*35);
 K.stepT-=dt;
 if(K.stepT<=0&&d<620){
  K.stepT=(K.state==='chase')?0.3:0.55;
  sfx.kstep(Math.max(0.02,0.3*(1-d/600)));
 }
}
function updatePlayer(dt){
 if(P.energyT>0)P.energyT=Math.max(0,P.energyT-dt);
 if(P.stunT>0){P.stunT=Math.max(0,P.stunT-dt);collideEnt(P,13);return;}
 var ax,ay;
 if(touchMove.active){ax=touchMove.x;ay=touchMove.y;}
 else{
  ax=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  ay=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
 }
 var mv=Math.hypot(ax,ay),dx=0,dy=0,moveScale=1;
 if(mv>0){dx=ax/mv;dy=ay/mv;moveScale=Math.min(mv,1);}
 P.crouch=!!(keys.ControlLeft||keys.ControlRight||keys.KeyC);
 var energized=P.energyT>0;
 var wantSprint=touchMove.active?(moveScale>0.82&&!P.crouch&&mv>0&&(energized||(!P.exh&&P.stam>0))):
  ((keys.ShiftLeft||keys.ShiftRight)&&!P.crouch&&mv>0&&(energized||(!P.exh&&P.stam>0)));
 P.sprint=wantSprint;
 if(wantSprint&&!energized){P.stam-=30*dt;if(P.stam<=0)P.exh=true;}
 else if(!wantSprint){P.stam=Math.min(100,P.stam+15*dt);if(P.stam>30)P.exh=false;}
 var spd=P.crouch?72:(wantSprint?250:132);
 if(P.speedBoostT>0){P.speedBoostT=Math.max(0,P.speedBoostT-dt);spd*=1.3;}
 P.x+=dx*spd*dt*moveScale;P.y+=dy*spd*dt*moveScale;
 collideEnt(P,13);
 if(touchAim.active){P.a=touchAim.angle;}
 else{var wx=cam.x-W/2+mouse.x,wy=cam.y-H/2+mouse.y;P.a=Math.atan2(wy-P.y,wx-P.x);}
 P.hidden=false;
 if(P.crouch&&!P.flash){
  for(var i=0;i<bushes.length;i++){if(Math.hypot(bushes[i].x-P.x,bushes[i].y-P.y)<bushes[i].r){P.hidden=true;break;}}
 }
 if(mv>0){
  P.stepT+=dt;
  if(P.stepT>(P.crouch?0.6:(P.sprint?0.27:0.42))){
   P.stepT=0;
   sfx.step(P.crouch?0.04:(P.sprint?0.2:0.1));
   emitNoise(P.x,P.y,P.crouch?45:(P.sprint?270:130));
  }
 }
 P.cd=Math.max(0,P.cd-dt);P.sgcd=Math.max(0,P.sgcd-dt);
 if((mouse.l||touchFire)&&P.cd<=0)firePistol();
 if(mouse.r&&P.sgcd<=0&&P.hasShotgun)fireShotgun();
}

function updateBullets(dt){

 for(var i=0;i<bullets.length;i++){
  var b=bullets[i];
  b.px=b.x;b.py=b.y;
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.dist+=Math.hypot(b.vx*dt,b.vy*dt);
  var dead=false;
  for(var j=0;j<trees.length;j++){
   var t=trees[j];
   if(Math.hypot(t.x-b.x,t.y-b.y)<t.r){
    for(var s=0;s<4;s++)sparks.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*70,vy:(Math.random()-0.5)*80,t:0.18,c:'#8a8f96'});
    dead=true;break;
   }
  }
  if(!dead&&K.active&&K.stun<=0&&Math.hypot(K.x-b.x,K.y-b.y)<16){
   for(var s2=0;s2<6;s2++)sparks.push({x:K.x,y:K.y,vx:(Math.random()-0.5)*90,vy:(Math.random()-0.5)*90,t:0.25,c:'#ffd77a'});

   if(!K.shotMsg){K.shotMsg=true;centerFlash(L('ПУЛИ ПРОХОДЯТ СКВОЗЬ НЕГО. ОН НЕ ОСТАНАВЛИВАЕТСЯ.','BULLETS PASS THROUGH IT. IT DOES NOT STOP.'),3.2);}
   dead=true;
  }
  if(!dead&&bulletHitTarget(b.x,b.y))dead=true;
  if(!dead&&bulletHitBear(b.x,b.y,b.dmg))dead=true;
  if(!dead&&bulletHitWolf(b.x,b.y,b.dmg))dead=true;
  if(!dead&&PATROL===3&&bulletHitSvMobs(b.x,b.y,b.dmg))dead=true;

function pineSilhouette(g2,x,baseY,h2){
 g2.beginPath();
 g2.moveTo(x,baseY);
 g2.lineTo(x-h2*0.32,baseY-h2*0.35);g2.lineTo(x-h2*0.18,baseY-h2*0.35);
 g2.lineTo(x-h2*0.28,baseY-h2*0.65);g2.lineTo(x-h2*0.14,baseY-h2*0.65);
 g2.lineTo(x,baseY-h2);
 g2.lineTo(x+h2*0.14,baseY-h2*0.65);g2.lineTo(x+h2*0.28,baseY-h2*0.65);
 g2.lineTo(x+h2*0.18,baseY-h2*0.35);g2.lineTo(x+h2*0.32,baseY-h2*0.35);
 g2.closePath();g2.fill();
}
function drawPanoLayer(g2,w,baseY,spacing,speed,t,color,scale,sway){
 g2.fillStyle=color;
 var offset=(t*speed)%spacing;
 for(var x=-offset-spacing;x<w+spacing;x+=spacing){
  var h2=(20+((Math.sin(x*0.037)+1)*13))*scale;
  var by=baseY+Math.sin(t*0.25+x*0.01)*sway;
  pineSilhouette(g2,x,by,h2);
 }
}
var menuPanoRunning=0;
function menuPanoInit(cvs2){
 if(!cvs2)return;
 var g2=cvs2.getContext('2d');
 var t0=performance.now();
 var myId=++menuPanoRunning;
 function frame(now){
  if(myId!==menuPanoRunning||!cvs2.isConnected)return;
  var t=(now-t0)/1000;
  var w=cvs2.width,h=cvs2.height;
  var sky=g2.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#0a1522');sky.addColorStop(0.55,'#132038');sky.addColorStop(1,'#16241a');
  g2.fillStyle=sky;g2.fillRect(0,0,w,h);
  g2.fillStyle='rgba(232,230,216,0.9)';g2.beginPath();g2.arc(w*0.8,h*0.26,16,0,6.283);g2.fill();
  g2.fillStyle='rgba(232,230,216,0.12)';g2.beginPath();g2.arc(w*0.8,h*0.26,28,0,6.283);g2.fill();
  for(var i=0;i<34;i++){
   var sx=(i*97.3+t*4)%w,sy=(i*53.7)%(h*0.5);
   g2.fillStyle='rgba(255,255,255,'+(0.25+0.25*Math.sin(t*2+i)).toFixed(2)+')';
   g2.fillRect(sx,sy,1.4,1.4);
  }
  drawPanoLayer(g2,w,h*0.68,58,10,t,'#0f1b16',0.85,2);
  drawPanoLayer(g2,w,h*0.8,44,22,t,'#0a130f',1.05,3);
  drawPanoLayer(g2,w,h*0.94,34,40,t,'#050b08',1.3,4);
  var fog=g2.createLinearGradient(0,h*0.6,0,h);
  fog.addColorStop(0,'rgba(6,10,8,0)');fog.addColorStop(1,'rgba(6,10,8,0.55)');
  g2.fillStyle=fog;g2.fillRect(0,0,w,h);
  var vg=g2.createRadialGradient(w/2,h/2,h*0.2,w/2,h/2,w*0.7);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.5)');
  g2.fillStyle=vg;g2.fillRect(0,0,w,h);
  requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}

function svSafeSpawnPos(){
 for(var tries=0;tries<40;tries++){
  var x=80+Math.random()*(WORLD-160),y=80+Math.random()*(WORLD-160);
  if(Math.hypot(x-P.x,y-P.y)<650)continue;
  if(x>view.x0-100&&x<view.x1+100&&y>view.y0-100&&y<view.y1+100)continue;
  return {x:x,y:y};
 }
 var a=Math.random()*TAU;
 return {x:clamp(P.x+Math.cos(a)*900,60,WORLD-60),y:clamp(P.y+Math.sin(a)*900,60,WORLD-60)};
}

function svShotgunHit(){
 var best=null,bestD=Infinity;
 function check(x,y,kind,ref){
  var d=Math.hypot(x-P.x,y-P.y),a=Math.atan2(y-P.y,x-P.x);
  if(d<330&&angDiff(a,P.a)<0.6&&losClear(P.x,P.y,x,y)&&d<bestD){bestD=d;best={x:x,y:y,kind:kind,ref:ref};}
 }
 for(var i=0;i<svWolves.length;i++){var w=svWolves[i];if(w.active)check(w.x,w.y,'wolf',w);}
 for(var j=0;j<svBears.length;j++){var b=svBears[j];if(b.active)check(b.x,b.y,'bear',b);}
 for(var k=0;k<svHedgehogs.length;k++){var h=svHedgehogs[k];if(h.active)check(h.x,h.y,'hedgehog',h);}
 for(var l=0;l<svBoars.length;l++){var o=svBoars[l];if(o.active)check(o.x,o.y,'boar',o);}
 if(svBossWolf&&svBossWolf.active)check(svBossWolf.x,svBossWolf.y,'bossWolf',svBossWolf);
 if(svBossBear&&svBossBear.active)check(svBossBear.x,svBossBear.y,'bossBear',svBossBear);
 if(!best)return false;
 if(best.kind==='wolf')damageSvWolf(best.ref,SHOTGUN_DMG,best.x,best.y);
 else if(best.kind==='bear')damageSvBear(best.ref,SHOTGUN_DMG,best.x,best.y);
 else if(best.kind==='hedgehog')damageSvHedgehog(best.ref,SHOTGUN_DMG,best.x,best.y);
 else if(best.kind==='boar')damageSvBoar(best.ref,SHOTGUN_DMG,best.x,best.y);
 else if(best.kind==='bossWolf')damageSvBossWolf(SHOTGUN_DMG,best.x,best.y);
 else if(best.kind==='bossBear')damageSvBossBear(SHOTGUN_DMG,best.x,best.y);
 return true;
}
function updateSurvivalWaves(dt){
 if(svEnded)return;
 if(svBreak){
  svWaveT-=dt;
  if(svWaveT<=0){
   svBreak=false;
   svPreWaveGrant(svWaveIdx);
   svSpawnWaveComposition(svWaveIdx);
   var curMedkits=svMedkits.filter(function(m){return !m.got;}).length;
   for(var mi=0;mi<2&&curMedkits<3;mi++,curMedkits++){
    var mp=svSafeSpawnPos();
    svMedkits.push({x:mp.x,y:mp.y,got:false});
   }
   centerFlash(L('ВОЛНА '+(svWaveIdx+1),'WAVE '+(svWaveIdx+1)),2.6);
   sfx.wolfHowl();
  }
 }else{
  if(svAliveCount()===0){
   svGrantReward(svWaveIdx);
   svWaveIdx++;
   if(svWaveIdx>=SV_WAVES.length){svEndSurvival();return;}
   svBreak=true;svWaveT=15;
  }
 }
}
function svMoveGeneric(m,speed,dmg,dt,radius,deathCause){
 var dx=P.x-m.x,dy=P.y-m.y,d=Math.hypot(dx,dy)||1;
 m.head=angN(Math.atan2(dy,dx));
 m.x+=dx/d*speed*dt;m.y+=dy/d*speed*dt;
 collideEnt(m,radius);
 m.stepT-=dt;if(m.stepT<=0){m.stepT=0.2;sfx.bearStep(0.12);}
 if(m.hitCD>0)m.hitCD-=dt;
 if(d<radius+13&&m.hitCD<=0){m.hitCD=1.2;hurtPlayer(m.dmg,deathCause);}
}
function updateSvMobs(dt){
 if(!P||PATROL!==3)return;
 for(var i=0;i<svWolves.length;i++){var w=svWolves[i];if(w.active)svMoveGeneric(w,w.speed,w.dmg,dt,11,'wolf');}
 for(var j=0;j<svBears.length;j++){var b=svBears[j];if(b.active)svMoveGeneric(b,118.125*b.spdMul,b.dmg,dt,20,'bear');}
 if(svBossWolf&&svBossWolf.active)svMoveGeneric(svBossWolf,svBossWolf.speed,svBossWolf.dmg,dt,16,'wolf');
 if(svBossBear&&svBossBear.active)svMoveGeneric(svBossBear,svBossBear.speed,svBossBear.dmg,dt,26,'bear');
 for(var k=0;k<svHedgehogs.length;k++){
  var h=svHedgehogs[k];if(!h.active)continue;
  var hdx=P.x-h.x,hdy=P.y-h.y,hd=Math.hypot(hdx,hdy)||1;
  h.dirX=hdx/hd;h.dirY=hdy/hd;
  h.head=angN(Math.atan2(h.dirY,h.dirX));
  h.x+=h.dirX*300*dt;h.y+=h.dirY*300*dt;
  collideEnt(h,10);
  if(h.hitCD>0)h.hitCD-=dt;
  h.rollT=(h.rollT||0)-dt;if(h.rollT<=0){h.rollT=0.5;if(hd<600)sfx.hedgehogRoll();}
  if(hd<23&&h.hitCD<=0){h.hitCD=1.2;P.stunT=Math.max(P.stunT||0,0.5);sfx.hedgehogStun();}
 }
 for(var l=0;l<svBoars.length;l++){
  var o=svBoars[l];if(!o.active)continue;
  var odx=P.x-o.x,ody=P.y-o.y,od=Math.hypot(odx,ody)||1;
  odx/=od;ody/=od;
  var dot=o.lastDx*odx+o.lastDy*ody;
  if(dot>0.92)o.straightT+=dt;else o.straightT=0;
  o.lastDx=odx;o.lastDy=ody;
  var spdMul=1+Math.min(1,o.straightT*0.1);
  o.head=angN(Math.atan2(ody,odx));
  o.x+=odx*150*spdMul*dt;o.y+=ody*150*spdMul*dt;
  collideEnt(o,17);
  o.stepT-=dt;if(o.stepT<=0){o.stepT=0.2;sfx.bearStep(0.14);}
  if(spdMul>1.5&&!o.snorted&&od<700){o.snorted=true;sfx.boarSnort();}
  else if(spdMul<1.1)o.snorted=false;
  if(o.hitCD>0)o.hitCD-=dt;
  if(od<30&&o.hitCD<=0){o.hitCD=1.3;hurtPlayer(0.5+(spdMul-1)*2.5,'boar');}
 }
}

function roomAt(name){for(var i=0;i<MROOMS.length;i++)if(MROOMS[i].name===name)return MROOMS[i];return MROOMS[0];}
function pickThiefRoom2(x,y){
 for(var i=0;i<MROOMS.length;i++){
  var r=MROOMS[i];
  if(r.name!=='security'&&x>=r.x0&&x<=r.x1&&y>=r.y0&&y<=r.y1)return r.name;
 }
 var pool=MROOMS.filter(function(r){return r.name!=='security';});
 return pool[Math.floor(Math.random()*pool.length)].name;
}
function randInRoom(r,pad){pad=pad||60;return {x:r.x0+pad+Math.random()*Math.max(1,(r.x1-r.x0-pad*2)),y:r.y0+pad+Math.random()*Math.max(1,(r.y1-r.y0-pad*2))};}
function collideEnt2(o,r){
 for(var i=0;i<MWALLS.length;i++){
  var w=MWALLS[i];
  var cx=clamp(o.x,w.x,w.x+w.w),cy=clamp(o.y,w.y,w.y+w.h);
  var dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);
  if(d<r){
   if(d>0.001){o.x+=dx/d*(r-d);o.y+=dy/d*(r-d);}
   else o.y+=r;
  }
 }
 o.x=clamp(o.x,10,WORLD2W-10);o.y=clamp(o.y,10,WORLD2H-10);
}
function inDarkRoom2(x,y){

 return false;
}

function segIntersectsRect2(x1,y1,x2,y2,w){
 var xmin=w.x,xmax=w.x+w.w,ymin=w.y,ymax=w.y+w.h;
 var dx=x2-x1,dy=y2-y1;
 var p=[-dx,dx,-dy,dy],q=[x1-xmin,xmax-x1,y1-ymin,ymax-y1];
 var t0=0,t1=1;
 for(var i=0;i<4;i++){
  if(p[i]===0){
   if(q[i]<0)return false;
  }else{
   var r=q[i]/p[i];
   if(p[i]<0){if(r>t1)return false;if(r>t0)t0=r;}
   else{if(r<t0)return false;if(r<t1)t1=r;}
  }
 }
 return true;
}
function hasLineOfSight2(x1,y1,x2,y2){

 }

}

function steerTarget2(ox,oy,tx,ty){

 for(i=0;i<crates.length;i++)if(!crates[i].got)hole(crates[i].x,crates[i].y,26,0.22);
 for(i=0;i<bearCrates.length;i++)if(!bearCrates[i].got)hole(bearCrates[i].x,bearCrates[i].y,26,0.22);
 for(i=0;i<bearShells.length;i++)if(!bearShells[i].got)hole(bearShells[i].x,bearShells[i].y,24,0.2);
 if(shells&&!shells.got)hole(shells.x,shells.y,24,0.2);
 for(i=0;i<targets.length;i++)if(!targets[i].hit)hole(targets[i].x,targets[i].y,26,0.18);
 if(grenadeItem&&!grenadeItem.got)hole(grenadeItem.x,grenadeItem.y,22,0.22);
 if(figurineVisible&&!haveFigurine)hole(FIGURINE_POS.x,FIGURINE_POS.y,26,0.24+0.1*Math.sin(gTime*2.6));
 if(clawItem&&!clawItem.got)hole(clawItem.x,clawItem.y,24,0.24);
 if(!tabletOpen)hole((PATROL===3?TABLET_POS3:TABLET_POS).x,(PATROL===3?TABLET_POS3:TABLET_POS).y,50,0.4+0.15*Math.sin(gTime*3));
 if(fx.muzzle>0)hole(fx.mx,fx.my,170,Math.min(1,fx.muzzle*7));
 if(K.active&&K.stun>0)hole(K.x,K.y,70,0.5);
 if(bear&&bear.active)hole(bear.x,bear.y,46,0.3);
 if(torchLit)for(i=0;i<TORCHES.length;i++)hole(TORCHES[i].x,TORCHES[i].y-10,280+Math.sin(gTime*11+i)*18,0.78);
 for(i=0;i<fireflies.length;i++){
  var f=fireflies[i];
  hole(f.x,f.y,22,0.28+0.22*Math.sin(gTime*3+f.ph));
 }
 if(fx.ltA>0){
  lctx.fillStyle='rgba(0,0,0,'+(fx.ltA*0.9).toFixed(3)+')';
  lctx.fillRect(cam.x-W/2-100,cam.y-H/2-100,W+200,H+200);
 }
 lctx.restore();
 ctx.save();
 ctx.setTransform(1,0,0,1,0,0);
 ctx.drawImage(lcv,0,0);
 ctx.restore();
}
function drawGlows(shx,shy){
 ctx.save();
 ctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 ctx.globalCompositeOperation='lighter';
 var i;
 if(fx.muzzle>0)glowC(fx.mx,fx.my,130,'rgba(255,235,170,'+Math.min(0.7,fx.muzzle*5).toFixed(3)+')');
 glowC(CAR.x-14,CAR.y,26,'rgba(255,70,70,'+(0.1+0.16*Math.max(0,Math.sin(gTime*4))).toFixed(3)+')');
 glowC(CAR.x+14,CAR.y,26,'rgba(80,140,255,'+(0.1+0.16*Math.max(0,-Math.sin(gTime*4))).toFixed(3)+')');
 if(Q!=='hunt')glowC(CABIN.x-58,CABIN.y-8,55,'rgba(255,215,140,'+(0.18+0.06*Math.sin(gTime*9)).toFixed(3)+')');
 if(P.clues>=10)glowC(CAR.x,CAR.y,140+70*(0.5+0.5*Math.sin(gTime*3)),'rgba(255,215,120,'+(0.06+0.08*(0.5+0.5*Math.sin(gTime*3))).toFixed(3)+')');
 for(i=0;i<clues.length;i++){
  var c=clues[i];
  if(c.got)continue;
  var col=null;
  if(c.k==='phone')col='125,220,255';
  if(c.k==='gps')col='125,235,140';
  if(c.k==='tape')col='255,110,90';
  if(col)glowC(c.x,c.y,16,'rgba('+col+','+(0.3+0.25*Math.sin(gTime*3+i)).toFixed(3)+')');
 }
 for(i=0;i<fireflies.length;i++){
  var f=fireflies[i];
  var fa=0.3+0.3*Math.sin(gTime*2.6+f.ph);
  glowC(f.x,f.y,10,'rgba(190,255,180,'+Math.max(0,fa).toFixed(3)+')');
 }
 if(torchLit)for(i=0;i<TORCHES.length;i++){
  var tt=TORCHES[i];
  glowC(tt.x,tt.y-10,150+10*Math.sin(gTime*13+i),'rgba(255,150,50,'+(0.4+0.15*Math.sin(gTime*17+i)).toFixed(3)+')');
 }
 if(K.active&&K.stun<=0){
  ctx.save();
  ctx.translate(K.x,K.y);ctx.rotate(K.head);
  var kcg=ctx.createRadialGradient(0,0,8,0,0,240);
  kcg.addColorStop(0,'rgba(255,225,110,0.32)');
  kcg.addColorStop(0.6,'rgba(255,205,80,0.14)');
  kcg.addColorStop(1,'rgba(255,190,60,0)');
  ctx.fillStyle=kcg;
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,240,-0.42,0.42);ctx.closePath();ctx.fill();
  ctx.restore();
 }
 if(!tabletOpen)glowC((PATROL===3?TABLET_POS3:TABLET_POS).x,(PATROL===3?TABLET_POS3:TABLET_POS).y,26,'rgba(150,220,255,'+(0.35+0.2*Math.sin(gTime*3)).toFixed(2)+')');
 if(bear&&bear.active){
  glowC(bear.x+Math.cos(bear.head)*20,bear.y+Math.sin(bear.head)*6,14,'rgba(255,40,20,'+(0.4+0.25*Math.sin(gTime*8)).toFixed(3)+')');
 }
 if(K.active){
  var ex=K.x+Math.cos(K.head)*8,ey=K.y+Math.sin(K.head)*8;
  var ox=Math.cos(K.head+Math.PI/2)*2.6,oy=Math.sin(K.head+Math.PI/2)*2.6;
  var ec=(K.stun>0)?'255,215,120':(K.berserk?'255,120,20':'255,45,45');
  var ea=(K.stun>0)?(0.3+0.3*Math.sin(gTime*15)):(K.berserk?(0.7+0.3*Math.sin(gTime*20)):(0.5+0.4*chaseMix));
  glowC(ex,ey,K.berserk?22:15,'rgba('+ec+','+Math.max(0,ea).toFixed(3)+')');
  ctx.fillStyle='rgba('+ec+',0.95)';
  ctx.beginPath();ctx.arc(ex+ox,ey+oy,1.8,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(ex-ox,ey-oy,1.8,0,TAU);ctx.fill();
 }
 for(i=0;i<sparks.length;i++){
  var sp=sparks[i];
  ctx.globalAlpha=Math.min(1,sp.t*4);
  ctx.fillStyle=sp.c;
  ctx.beginPath();ctx.arc(sp.x,sp.y,2.2,0,TAU);ctx.fill();
 }
 ctx.globalAlpha=1;
 drawSnipeDot();
 ctx.restore();
}
function drawFogWorld(shx,shy){
 ctx.save();
 ctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 for(var i=0;i<fog.length;i++){
  var f=fog[i];
  if(f.x<view.x0-100||f.x>view.x1+100||f.y<view.y0-100||f.y>view.y1+100)continue;
  var fa=0.035+fogN*0.05;
  var g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
  g.addColorStop(0,'rgba(155,165,160,'+fa.toFixed(3)+')');
  g.addColorStop(1,'rgba(155,165,160,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill();
 }
 ctx.restore();
}
function drawVignette(){
 var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,Math.max(W,H)*0.72);
 vg.addColorStop(0,'rgba(0,0,0,0)');
 vg.addColorStop(1,'rgba(0,0,0,0.6)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 if(fx.ltA>0){
  ctx.fillStyle='rgba(205,218,255,'+(fx.ltA*0.3).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
 }
 if(chaseMix>0.02){
  var rg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);
  var ra=Math.max(0,(0.09+0.06*Math.sin(gTime*6))*chaseMix);
  rg.addColorStop(0,'rgba(140,10,10,0)');
  rg.addColorStop(1,'rgba(150,15,15,'+ra.toFixed(3)+')');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
 }
 if(hurtFlashT>0){
  ctx.fillStyle='rgba(200,20,20,'+(hurtFlashT/0.4*0.35).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
 }
 if(PATROL===2&&P&&P.burnT>0){
  var burnA=Math.min(1,P.burnT/2)*0.55+0.12*Math.sin(gTime*18);
  var bvg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.26,W/2,H/2,Math.max(W,H)*0.62);
  bvg.addColorStop(0,'rgba(210,20,10,0)');
  bvg.addColorStop(1,'rgba(210,20,10,'+Math.max(0,burnA).toFixed(3)+')');
  ctx.fillStyle=bvg;ctx.fillRect(0,0,W,H);
 }
 if(PATROL===2&&mFCBoomShown&&!mFCDead){
  var boomA=0.55+0.25*Math.sin(gTime*24);
  ctx.fillStyle='rgba(255,90,20,'+boomA.toFixed(2)+')';
  ctx.fillRect(0,0,W,H);
  for(var bi=0;bi<7;bi++){
   var bx=(bi*0.15+0.05)*W+Math.sin(gTime*3+bi)*30;
   var by=H-(( (gTime*60+bi*70)%(H+120) ));
   ctx.fillStyle='rgba(35,30,28,'+(0.4+0.15*Math.sin(gTime*4+bi)).toFixed(2)+')';
   ctx.beginPath();ctx.arc(bx,by,60+bi*8,0,TAU);ctx.fill();
  }
  ctx.fillStyle='rgba(255,200,90,'+(0.3*boomA).toFixed(2)+')';
  ctx.fillRect(0,0,W,H);
 }
}
function drawMinimap(){
 var ms=150,mx0=W-ms-16,my0=14,sc=ms/WORLD;
 ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(mx0,my0,ms,ms);
 ctx.fillStyle='#1c2126';ctx.fillRect(mx0,my0,ms,RY1*sc);
 ctx.strokeStyle='#3c4450';ctx.lineWidth=1;ctx.strokeRect(mx0+0.5,my0+0.5,ms-1,ms-1);
 for(var i=0;i<clues.length;i++){
  var c=clues[i];
  if(c.got){
   ctx.fillStyle='#39412f';ctx.fillRect(mx0+c.x*sc-1.5,my0+c.y*sc-1.5,3,3);
  }else if(Math.hypot(c.x-P.x,c.y-P.y)<330){
   ctx.fillStyle='rgba(255,205,95,'+(0.35+0.35*Math.sin(gTime*6)).toFixed(2)+')';
   ctx.beginPath();ctx.arc(mx0+c.x*sc,my0+c.y*sc,2.4,0,TAU);ctx.fill();
  }
 }
 if(PATROL===3){
  var svM=svAllMobsList();
  for(var mi3=0;mi3<svM.length;mi3++){
   var mm3=svM[mi3],dm3=Math.hypot(mm3.x-P.x,mm3.y-P.y);
   if(dm3<420){
    ctx.fillStyle=mm3.boss?'rgba(255,140,40,'+(0.5+0.4*Math.sin(gTime*6)).toFixed(2)+')':'rgba(255,90,60,0.85)';
    ctx.beginPath();ctx.arc(mx0+mm3.x*sc,my0+mm3.y*sc,mm3.boss?3.2:2,0,TAU);ctx.fill();
   }
  }
 }
 if(radarActive){
  var nd=1e18,nc=null;
  if(PATROL===3){
   var svM2=svAllMobsList();
   for(var ri3=0;ri3<svM2.length;ri3++){var rdd3=Math.hypot(svM2[ri3].x-P.x,svM2[ri3].y-P.y);if(rdd3<nd){nd=rdd3;nc=svM2[ri3];}}
  }else{
   for(var ri=0;ri<clues.length;ri++){if(!clues[ri].got){var rdd=Math.hypot(clues[ri].x-P.x,clues[ri].y-P.y);if(rdd<nd){nd=rdd;nc=clues[ri];}}}
  }
  if(nc){
   var rph=(radarT%1);
   ctx.strokeStyle='rgba(255,60,50,'+(0.7*(1-rph)).toFixed(2)+')';ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(mx0+nc.x*sc,my0+nc.y*sc,3+rph*10,0,TAU);ctx.stroke();
   ctx.fillStyle='#ff3a2a';
   ctx.beginPath();ctx.arc(mx0+nc.x*sc,my0+nc.y*sc,2.6,0,TAU);ctx.fill();
  }
 }
 if(PATROL!==3){ctx.fillStyle='#5aa2ff';ctx.fillRect(mx0+CAR.x*sc-3,my0+CAR.y*sc-2,6,4);}
 if(bear&&bear.active){
  ctx.fillStyle='#ff8a3a';
  ctx.beginPath();ctx.arc(mx0+bear.x*sc,my0+bear.y*sc,2.6,0,TAU);ctx.fill();
 }
 if(K.active){
  var kd=Math.hypot(K.x-P.x,K.y-P.y);
  if((kd<420||K.state==='chase')&&Math.sin(gTime*9)>-0.4){
   ctx.fillStyle='#ff4040';
   ctx.beginPath();ctx.arc(mx0+K.x*sc,my0+K.y*sc,2.4,0,TAU);ctx.fill();
  }
 }
 ctx.fillStyle='#fff';
 ctx.beginPath();ctx.arc(mx0+P.x*sc,my0+P.y*sc,2.4,0,TAU);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,0.6)';
 ctx.beginPath();ctx.moveTo(mx0+P.x*sc,my0+P.y*sc);
 ctx.lineTo(mx0+(P.x+Math.cos(P.a)*26)*sc,my0+(P.y+Math.sin(P.a)*26)*sc);
 ctx.stroke();
 ctx.font='11px monospace';ctx.textAlign='right';
 if(radarActive){ctx.fillStyle='#ff5a4a';ctx.fillText('U · RADAR '+Math.ceil(radarT)+'s',mx0+ms,my0+ms+15);}
 else if(radarCD>0){ctx.fillStyle='#6d7a63';ctx.fillText('U · '+Math.ceil(radarCD)+'s',mx0+ms,my0+ms+15);}
 else{ctx.fillStyle='#9fb08a';ctx.fillText('U · '+L('РАДАР','RADAR'),mx0+ms,my0+ms+15);}
 ctx.textAlign='left';
}
function drawCrosshair(){
 var touchy=document.body.classList.contains('touch');
 var rad=touchy?8:5,tick0=touchy?13:10,tick1=touchy?9:6;
 ctx.strokeStyle=touchy?'rgba(255,210,180,0.75)':'rgba(255,255,255,0.55)';
 ctx.lineWidth=touchy?2:1.3;
 ctx.beginPath();ctx.arc(mouse.x,mouse.y,rad,0,TAU);ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(mouse.x-tick0,mouse.y);ctx.lineTo(mouse.x-tick1,mouse.y);
 ctx.moveTo(mouse.x+tick1,mouse.y);ctx.lineTo(mouse.x+tick0,mouse.y);
 ctx.moveTo(mouse.x,mouse.y-tick0);ctx.lineTo(mouse.x,mouse.y-tick1);
 ctx.moveTo(mouse.x,mouse.y+tick1);ctx.lineTo(mouse.x,mouse.y+tick0);
 ctx.stroke();
 if(touchy){
  ctx.fillStyle='rgba(255,150,110,0.85)';
  ctx.beginPath();ctx.arc(mouse.x,mouse.y,2,0,TAU);ctx.fill();
 }
}
function render(){if(PATROL===2){renderPatrol2();return;}renderPatrol1();}
function renderPatrol1(){
 if(!P)return;
 var shx=(Math.random()-0.5)*camShake*14,shy=(Math.random()-0.5)*camShake*12;
 view.x0=cam.x-W/2-120;view.y0=cam.y-H/2-120;
 view.x1=cam.x+W/2+120;view.y1=cam.y+H/2+120;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.fillStyle='#04070a';ctx.fillRect(0,0,W,H);
 ctx.save();
 ctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 drawGround();
 drawRoad();
 drawTrails();
 drawClues();
 drawItems();
 drawTargets();
 drawQuestPickups();
 drawCabin();
 drawHut2();
 drawTorches();
 drawCar();
 drawTrees();
 drawRanger();
 drawBear();
 drawWolves();
 drawSvMobs();
 drawTabletItem();
 drawKiller();
 drawBullets();
 drawFlyingGrenade();
 drawPlayer();
 drawBushes();
 ctx.globalCompositeOperation='lighter';
 for(var s=0;s<sparks.length;s++){
  ctx.globalAlpha=Math.min(1,sparks[s].t*4);
  ctx.fillStyle=sparks[s].c;
  ctx.beginPath();ctx.arc(sparks[s].x,sparks[s].y,2.2,0,TAU);ctx.fill();
 }
 ctx.globalAlpha=1;
 ctx.globalCompositeOperation='source-over';
 ctx.restore();
 drawLights(shx,shy);
 drawGlows(shx,shy);
 drawFogWorld(shx,shy);
 ctx.setTransform(1,0,0,1,0,0);
 drawVignette();
 drawMinimap();
 drawCrosshair();
 if(PATROL===3){drawSvBossBars();drawSvWaveHUD();}
}
function loop(now){
 var dt=(now-last)/1000;last=now;
 if(!(dt>0)||dt>0.05)dt=0.016;
 gTime+=dt;
 if(mode==='play'){
  if(tabletOpen)updateTabletOnly(dt);
  else update(dt);
 }
 if(W>0&&H>0)render();
 if(tabletOpen&&phoneApp==='herocat')drawCat();
 requestAnimationFrame(loop);
}
reset();
menuInit();
requestAnimationFrame(loop);
})();
</script>
