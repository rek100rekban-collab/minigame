/* ===== PoliceEventManager (Phase 3) + Speeding event (Phase 4) ===== */
var c4Events=[],c4EventSeq=1,c4EventSpawnCD=10;
function c4MaxActiveEvents(){
 var elapsed=gTime-(c4Stats?c4Stats.started:gTime);
 if(elapsed<120)return 2;
 if(elapsed<300)return 3;
 return 5;
}
function c4FocusEvent(){
 var best=null,bestD=Infinity;
 for(var i=0;i<c4Events.length;i++){
  var ev=c4Events[i];
  if(ev.state==='COMPLETED'||ev.state==='FAILED')continue;
  var d=Math.hypot(ev.npc.x-P.x,ev.npc.y-P.y);
  if(d<bestD){bestD=d;best=ev;}
 }
 return best;
}
function c4FindSpawnPoint(){
 for(var tries=0;tries<24;tries++){
  var x=150+Math.random()*(CITYW-300),y=150+Math.random()*(CITYH-300);
  var d=Math.hypot(x-P.x,y-P.y);
  if(d<450||d>3200)continue;
  var blocked=false;
  for(var i=0;i<CITYWALLS.length;i++){var w=CITYWALLS[i];if(x>w.x-30&&x<w.x+w.w+30&&y>w.y-30&&y<w.y+w.h+30){blocked=true;break;}}
  if(!blocked)return {x:x,y:y};
 }
 return {x:clamp(P.x+700,100,CITYW-100),y:clamp(P.y,100,CITYH-100)};
}
/* -- districts (Phase 30) -- */
function c4DistrictAt(x,y){
 var gx=clamp(Math.floor(x/CITY_BLOCK),0,CITY_GRID-1),gy=clamp(Math.floor(y/CITY_BLOCK),0,CITY_GRID-1);
 var half=(CITY_GRID-1)/2;
 var ddx=gx-half,ddy=gy-half;
 var distBlocks=Math.max(Math.abs(ddx),Math.abs(ddy));
 var isEdge=(gx===0||gy===0||gx===CITY_GRID-1||gy===CITY_GRID-1);
 if(distBlocks<=1.5)return 'downtown';
 if(isEdge&&(gx+gy)%2===0)return 'highway';
 if(distBlocks>=5)return (gx<half)?'industrial':'residential';
 return (Math.abs(ddx)>Math.abs(ddy))?'commercial':'residential';
}
function c4DistrictWeights(d){
 if(d==='downtown')return {disturbance:3,wanted:2,gang:1,armed:1};
 if(d==='commercial')return {disturbance:2,wanted:2,armed:1};
 if(d==='residential')return {disturbance:3,wanted:1,police_assist:1};
 if(d==='industrial')return {cartheft:2,armed:2,hostile_vehicle:1};
 if(d==='highway')return {speeding:3,cartheft:2,hostile_vehicle:1};
 return {disturbance:1,wanted:1,cartheft:1,speeding:1};
}
function c4WeightedPick(weights){
 var total=0,k;
 for(k in weights)total+=weights[k];
 var r=Math.random()*total;
 for(k in weights){r-=weights[k];if(r<=0)return k;}
 for(k in weights)return k;
}
/* -- shared vehicle-event helpers (Speeding + Car Theft) -- */
function c4PushApart(mover,anchor,minDist){
 var dx=mover.x-anchor.x,dy=mover.y-anchor.y,d=Math.hypot(dx,dy);
 if(d>=minDist)return false;
 if(d<=0.001){var ang=Math.random()*TAU;dx=Math.cos(ang);dy=Math.sin(ang);d=1;}
 mover.x+=dx/d*(minDist-d);mover.y+=dy/d*(minDist-d);
 return true;
}
function c4EdgeBounce(npc,margin){
 var bounced=false;
 if(npc.x<margin&&Math.cos(npc.a)<0){npc.a=Math.PI-npc.a;bounced=true;}
 else if(npc.x>CITYW-margin&&Math.cos(npc.a)>0){npc.a=Math.PI-npc.a;bounced=true;}
 if(npc.y<margin&&Math.sin(npc.a)<0){npc.a=-npc.a;bounced=true;}
 else if(npc.y>CITYH-margin&&Math.sin(npc.a)>0){npc.a=-npc.a;bounced=true;}
 return bounced;
}
function c4VehicleAvoidance(npc,dt,speed){
 if(!c4EdgeBounce(npc,150)){
  var aheadX=npc.x+Math.cos(npc.a)*80,aheadY=npc.y+Math.sin(npc.a)*80;
  var blocked=false;
  for(var i=0;i<CITYWALLS.length;i++){var w=CITYWALLS[i];if(aheadX>w.x&&aheadX<w.x+w.w&&aheadY>w.y&&aheadY<w.y+w.h){blocked=true;break;}}
  if(blocked)npc.a+=(Math.random()<0.5?1:-1)*Math.PI/2;
 }
 npc.x+=Math.cos(npc.a)*speed*dt;npc.y+=Math.sin(npc.a)*speed*dt;
 collideEnt4(npc,20);
}
function c4DamageVehicleEvent(ev,dmg){
 var npc=ev.npc;
 npc.carHp=Math.max(0,npc.carHp-dmg);npc.dmgFlashT=0.15;
 for(var i=0;i<4;i++)c4Sparks.push({x:npc.x,y:npc.y,vx:(Math.random()-0.5)*80,vy:(Math.random()-0.5)*80,t:0.25,c:'#e8c94a'});
 if(npc.carHp<=0&&ev.state!=='COMPLETED'){
  ev.state='COMPLETED';ev.resolvedAt=gTime;
  if(c4Stats){
   c4Stats.completed=(c4Stats.completed||0)+1;
   if(ev.type==='hostile_vehicle'){
    c4Stats.hostileDestroyed=(c4Stats.hostileDestroyed||0)+1;
    if(c4Stats.hostileDestroyed>=3)unlockAch('c4_crusher');
   }
  }
  sfx.c4VehicleExplode();camShake=Math.max(camShake,1.2);
  for(var j=0;j<18;j++)c4Sparks.push({x:npc.x,y:npc.y,vx:(Math.random()-0.5)*220,vy:(Math.random()-0.5)*220,t:0.5,c:j%2?'#ffb84a':'#ff5a2e'});
  centerFlash(L('CASE CLOSED — АВТОМОБИЛЬ УНИЧТОЖЕН','CASE CLOSED — VEHICLE DESTROYED'),2.2);
  c4AddCoins(4,'destroyed');
 }
}
/* -- Speeding (Phase 4) -- */
function c4SpawnSpeedingEvent(sp){
 sp=sp||c4FindSpawnPoint();
 var ang=Math.floor(Math.random()*4)*(Math.PI/2);
 var npc={x:sp.x,y:sp.y,a:ang,speed:300+Math.random()*60,state:'cruising',carHp:20,carHpMax:20,dmgFlashT:0};
 var ev={id:c4EventSeq++,type:'speeding',state:'ACTIVE',priority:'LOW',npc:npc,createdAt:gTime,resolvedAt:0};
 c4Events.push(ev);
 sfx.c4EventSpawn();
 centerFlash(L('НОВЫЙ ВЫЗОВ: ПРЕВЫШЕНИЕ СКОРОСТИ','NEW CALL: SPEEDING VEHICLE'),2.2);
}
function c4UpdateSpeedingEvent(ev,dt){
 var npc=ev.npc;
 if(ev.state==='COMPLETED'||ev.state==='FAILED')return;
 if(npc.dmgFlashT>0)npc.dmgFlashT=Math.max(0,npc.dmgFlashT-dt);
 if(ev.state==='ACTIVE'&&gTime-ev.createdAt>240){
  ev.state='FAILED';ev.resolvedAt=gTime;
  if(c4Stats)c4Stats.failed=(c4Stats.failed||0)+1;
  sfx.c4EventFailed();
  centerFlash(L('EVENT ESCAPED — НАРУШИТЕЛЬ СКРЫЛСЯ','EVENT ESCAPED — THE SUSPECT GOT AWAY'),2.4);
  return;
 }
 if(npc.state==='cruising'||npc.state==='fleeing'){
  var noticed=c4InCar&&(cityCar.siren||cityCar.lights)&&Math.hypot(npc.x-cityCar.x,npc.y-cityCar.y)<420;
  if(noticed&&npc.state==='cruising'){npc.state='stopping';ev.state='ACTIVE';}
  var moveSpd=npc.carHp<=10?npc.speed*0.7:npc.speed;
  c4VehicleAvoidance(npc,dt,moveSpd);
 }else if(npc.state==='stopping'){
  npc.speed=Math.max(0,npc.speed-140*dt);
  npc.x+=Math.cos(npc.a)*npc.speed*dt;npc.y+=Math.sin(npc.a)*npc.speed*dt;
  collideEnt4(npc,20);
  if(npc.speed<=0.5){
   npc.speed=0;npc.state='stopped';ev.state='PLAYER_RESPONDED';
   centerFlash(L('НАРУШИТЕЛЬ ОСТАНОВИЛСЯ. ПОДОЙДИ ПЕШКОМ И НАЖМИ [E]','THE SUSPECT HAS STOPPED. WALK UP AND PRESS [E]'),2.4);
  }
 }
}
function c4TryTicketNpc(){
 for(var i=0;i<c4Events.length;i++){
  var ev=c4Events[i];
  if(ev.type!=='speeding'||ev.npc.state!=='stopped'||ev.state!=='PLAYER_RESPONDED')continue;
  if(Math.hypot(ev.npc.x-P.x,ev.npc.y-P.y)>70)continue;
  if(Math.random()<0.78){
   ev.state='COMPLETED';ev.resolvedAt=gTime;
   if(c4Stats)c4Stats.completed=(c4Stats.completed||0)+1;
   centerFlash(L('ШТРАФ ВЫПИСАН. CASE CLOSED','TICKET ISSUED. CASE CLOSED'),2.2);
   sfx.c4TicketPrint();
   c4AddCoins(5,'ticket');
  }else{
   ev.npc.state='fleeing';ev.priority='MEDIUM';
   centerFlash(L('«Я НИЧЕГО ТЕБЕ НЕ ДОЛЖЕН!» — НАРУШИТЕЛЬ СНОВА ЗА РУЛЁМ','"I DON\'T OWE YOU ANYTHING!" — THE SUSPECT IS BACK BEHIND THE WHEEL'),2.6);
  }
  return true;
 }
 return false;

function c4LineOfSight(x1,y1,x2,y2){
 var steps=6;
 for(var s=1;s<steps;s++){
  var t=s/steps;
  var mx=x1+(x2-x1)*t,my=y1+(y2-y1)*t;
  for(var i=0;i<CITYWALLS.length;i++){
   var w=CITYWALLS[i];
   if(mx>w.x&&mx<w.x+w.w&&my>w.y&&my<w.y+w.h)return false;
  }
 }
 return true;
}
function c4PointBlocked(x,y){
 for(var i=0;i<CITYWALLS.length;i++){
  var w=CITYWALLS[i];
  if(x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h)return true;
 }
 return false;
}
function c4ApproachAvoidWalls(npc,tx,ty,speed,dt,collideR){
 var dx=tx-npc.x,dy=ty-npc.y,d=Math.hypot(dx,dy)||1;
 var baseA=Math.atan2(dy,dx);
 var tryOffsets=[0,0.4,-0.4,0.8,-0.8,1.2,-1.2,1.6,-1.6,2.0,-2.0,2.4,-2.4,2.8,-2.8,Math.PI];
 var probes=[50,26];
 var moveA=null,moveProbe=50;
 for(var p=0;p<probes.length&&moveA===null;p++){
  for(var i=0;i<tryOffsets.length;i++){
   var a=baseA+tryOffsets[i];
   if(!c4PointBlocked(npc.x+Math.cos(a)*probes[p],npc.y+Math.sin(a)*probes[p])){moveA=a;moveProbe=probes[p];break;}
  }
 }
 if(moveA===null)return false;
 npc.x+=Math.cos(moveA)*speed*dt;npc.y+=Math.sin(moveA)*speed*dt;
 collideEnt4(npc,collideR||13);
 return true;
}

function c4UpdateFootCriminal(ev,dt,escapeMsg){
 var npc=ev.npc;
 if(ev.state==='COMPLETED'||ev.state==='FAILED')return;
 if(npc.dmgFlashT>0)npc.dmgFlashT=Math.max(0,npc.dmgFlashT-dt);
 if(ev.state==='ACTIVE'&&gTime-ev.createdAt>240){
  ev.state='FAILED';ev.resolvedAt=gTime;
  if(c4Stats)c4Stats.failed=(c4Stats.failed||0)+1;
  sfx.c4EventFailed();
  centerFlash(escapeMsg,2.4);
  return;
 }
 var distToPlayer=Math.hypot(npc.x-P.x,npc.y-P.y);
 if(npc.state==='inside'){
  npc.emergeT+=dt;
  if(npc.emergeT>2.5||distToPlayer<300)npc.state=npc.behavior==='fight'?'fighting':'fleeing';
  return;
 }
 if(npc.state==='fighting'){
  if(distToPlayer>260)c4ApproachAvoidWalls(npc,P.x,P.y,90,dt,13);
  npc.a=Math.atan2(P.y-npc.y,P.x-npc.x);
  npc.atkCD-=dt;
  if(npc.atkCD<=0&&distToPlayer<420&&c4LineOfSight(npc.x,npc.y,P.x,P.y)){
   npc.atkCD=1.6;
   var bdx=P.x-npc.x,bdy=P.y-npc.y,bd=Math.hypot(bdx,bdy)||1;
   c4EnemyBullets.push({x:npc.x,y:npc.y,vx:bdx/bd*420,vy:bdy/bd*420,dist:0,maxDist:500,dmg:2});
   sfx.c4EnemyShot();
  }
 }else if(npc.state==='fleeing'){
  var margin=100,edged=false;
  if(npc.x<margin&&Math.cos(npc.fleeAngle)<0){npc.fleeAngle=Math.PI-npc.fleeAngle;edged=true;}
  else if(npc.x>CITYW-margin&&Math.cos(npc.fleeAngle)>0){npc.fleeAngle=Math.PI-npc.fleeAngle;edged=true;}
  if(npc.y<margin&&Math.sin(npc.fleeAngle)<0){npc.fleeAngle=-npc.fleeAngle;edged=true;}
  else if(npc.y>CITYH-margin&&Math.sin(npc.fleeAngle)>0){npc.fleeAngle=-npc.fleeAngle;edged=true;}
  if(!edged){
   var aheadX=npc.x+Math.cos(npc.fleeAngle)*60,aheadY=npc.y+Math.sin(npc.fleeAngle)*60;
   var blocked=false;
   for(var i=0;i<CITYWALLS.length;i++){var w=CITYWALLS[i];if(aheadX>w.x&&aheadX<w.x+w.w&&aheadY>w.y&&aheadY<w.y+w.h){blocked=true;break;}}
   if(blocked)npc.fleeAngle+=(Math.random()<0.5?1:-1)*Math.PI/2;
  }
  npc.a=npc.fleeAngle;
  npc.x+=Math.cos(npc.fleeAngle)*155*dt;npc.y+=Math.sin(npc.fleeAngle)*155*dt;
  collideEnt4(npc,13);
 }
}

function c4SpawnRandomEvent(){

 if(hasShop&&Math.random()<0.22){c4SpawnRobberyEvent();return;}
 var sp=c4FindSpawnPoint();
 var district=c4DistrictAt(sp.x,sp.y);
 var pick=c4WeightedPick(c4DistrictWeights(district));
 if(pick==='cartheft')c4SpawnCarTheftEvent(sp);
 else if(pick==='wanted')c4SpawnWantedEvent(sp);
 else if(pick==='disturbance')c4SpawnDisturbanceEvent(sp);
 else if(pick==='speeding')c4SpawnSpeedingEvent(sp);
 else if(pick==='armed')c4SpawnArmedRobberyEvent(sp);
 else if(pick==='gang')c4SpawnGangEvent(sp);
 else if(pick==='police_assist')c4SpawnPoliceAssistEvent(sp);

function c4UpdateEventManager(dt){
 c4EventSpawnCD-=dt;
 if(c4EventSpawnCD<=0){
  var activeCount=c4Events.filter(function(e){return e.state!=='COMPLETED'&&e.state!=='FAILED';}).length;
  if(activeCount<c4MaxActiveEvents())c4SpawnRandomEvent();
  c4EventSpawnCD=(16+Math.random()*12)/0.75;
 }
 for(var i=c4Events.length-1;i>=0;i--){
  var ev=c4Events[i];
  if(ev.type==='speeding')c4UpdateSpeedingEvent(ev,dt);
  else if(ev.type==='cartheft')c4UpdateCarTheftEvent(ev,dt);
  else if(ev.type==='robbery')c4UpdateRobberyEvent(ev,dt);
  else if(ev.type==='wanted')c4UpdateWantedEvent(ev,dt);
  else if(ev.type==='disturbance')c4UpdateDisturbanceEvent(ev,dt);
  else if(ev.type==='armed')c4UpdateArmedEvent(ev,dt);
  else if(ev.type==='gang')c4UpdateGangEvent(ev,dt);
  else if(ev.type==='police_assist')c4UpdatePoliceAssistEvent(ev,dt);
  else if(ev.type==='hostile_vehicle')c4UpdateHostileVehicleEvent(ev,dt);
  if((ev.state==='COMPLETED'||ev.state==='FAILED')&&gTime-ev.resolvedAt>3)c4Events.splice(i,1);
 }

function c4EventLabel(ev){
 if(ev.type==='speeding'){
  if(ev.npc.state==='fleeing')return L('ПОДОЗРЕВАЕМЫЙ СБЕЖАЛ — ДОГОНИ СНОВА','SUSPECT FLED — CHASE AGAIN');
  if(ev.npc.state==='stopped')return L('ОСТАНОВЛЕН — ПОДОЙДИ И НАЖМИ [E]','STOPPED — WALK UP AND PRESS [E]');
  if(ev.npc.state==='stopping')return L('ЗАМЕЧЕН, ТОРМОЗИТ','SPOTTED, SLOWING DOWN');
  return L('ПРЕВЫШЕНИЕ СКОРОСТИ','SPEEDING VEHICLE');
 }
 if(ev.type==='robbery'){
  if(ev.npc.state==='inside')return L('ОГРАБЛЕНИЕ МАГАЗИНА — ПРЕСТУПНИК ВНУТРИ','STORE ROBBERY — SUSPECT INSIDE');
  if(ev.npc.state==='fighting')return L('ПЕРЕСТРЕЛКА С ГРАБИТЕЛЕМ','SHOOTOUT WITH THE ROBBER');
  return L('ГРАБИТЕЛЬ УБЕГАЕТ','THE ROBBER IS FLEEING');
 }
 if(ev.type==='cartheft'){
  if(ev.npc.state==='stopped')return L('УГОНЩИК ЗАБЛОКИРОВАН — ПОДОЙДИ И НАЖМИ [E]','THIEF BOXED IN — WALK UP AND PRESS [E]');
  if(ev.npc.state==='fleeing')return L('ПОГОНЯ ЗА УГНАННЫМ АВТОМОБИЛЕМ','CHASING THE STOLEN VEHICLE');
  return L('УГОН АВТОМОБИЛЯ','CAR THEFT');
 }
 if(ev.type==='wanted'){
  if(ev.npc.state==='fighting')return L('ПЕРЕСТРЕЛКА С РАЗЫСКИВАЕМЫМ','SHOOTOUT WITH THE WANTED SUSPECT');
  return L('РАЗЫСКИВАЕМЫЙ УБЕГАЕТ','WANTED SUSPECT FLEEING');
 }
 if(ev.type==='disturbance'){
  if(ev.npc.state==='fighting')return L('СТЫЧКА С ДЕБОШИРОМ','SCUFFLE WITH THE TROUBLEMAKER');
  return L('ДЕБОШИР УБЕГАЕТ','TROUBLEMAKER FLEEING');
 }
 if(ev.type==='armed')return L('ВООРУЖЁННЫЙ ПРЕСТУПНИК','ARMED SUSPECT');
 if(ev.type==='gang'){
  var gAlive=ev.npcs.filter(function(m){return m.hp>0;}).length;
  return L('ПЕРЕСТРЕЛКА БАНДЫ — ОСТАЛОСЬ '+gAlive,'GANG SHOOTOUT — '+gAlive+' LEFT');
 }
 if(ev.type==='police_assist')return L('ПОЛИЦЕЙСКОМУ НУЖНА ПОМОЩЬ','OFFICER NEEDS ASSISTANCE');
 if(ev.type==='hostile_vehicle')return L('ОПАСНЫЙ АВТОМОБИЛЬ ПРОРЫВАЕТСЯ','HOSTILE VEHICLE BREAKING THROUGH');
 return ev.type;
}

 if(!P)return;
 var shx=(Math.random()-0.5)*camShake*10,shy=(Math.random()-0.5)*camShake*9;
 view.x0=cam.x-W/2-150;view.y0=cam.y-H/2-150;view.x1=cam.x+W/2+150;view.y1=cam.y+H/2+150;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.fillStyle='#111214';ctx.fillRect(0,0,W,H);
 ctx.save();
 ctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 drawCityGround();
 drawCityBoundary();
 drawCityBuildings();
 drawCityTrafficLights();
 drawCityCivCars();
 drawCityPeds();
 drawCityEvents();
 drawCityCarModel(cityCar,cityCar.lights,cityCar.siren);
 if(c4InCar)drawCityCarTurret(cityCar);
 if(!c4InCar){drawPlayer();c4DrawWeaponModel();}
 drawCityBullets();
 drawCityEnemyBullets();
 drawSparksCity();
 drawFlyingGrenadeCity();
 c4DrawFlyingPlasma();
 c4DrawDrone();
 drawCoinPopupsCity();
 ctx.restore();
 if(hurtFlashT>0){ctx.fillStyle='rgba(200,20,20,'+(hurtFlashT*0.35).toFixed(2)+')';ctx.fillRect(0,0,W,H);}
 drawCityMinimap();
 drawCoinsUICity();
 drawActiveCallUI();
 if(c4MapOpen)drawCityFullMap();
}
function drawCityFullMap(){
 ctx.setTransform(1,0,0,1,0,0);
 var mw=Math.min(W,H)*0.84,mh=mw;
 var mx0=(W-mw)/2,my0=(H-mh)/2;
 var sc=mw/CITYW;
 ctx.save();
 ctx.fillStyle='rgba(5,8,14,0.92)';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#1c2126';ctx.fillRect(mx0,my0,mw,mh);
 ctx.strokeStyle='#4a5560';ctx.lineWidth=2;ctx.strokeRect(mx0+1,my0+1,mw-2,mh-2);
 for(var i=0;i<CITYBUILDINGS.length;i++){
  var b=CITYBUILDINGS[i];
  var bx=mx0+(b.x+b.w/2)*sc,by=my0+(b.y+b.h/2)*sc;
  var col=b.kind==='gunshop'?'#ffcf4a':(b.kind==='station'?'#8ac0ff':(b.kind==='casino'?'#ff4ad0':(b.kind==='tuning'?'#ffb84a':(b.kind==='parking'?'#3a3a3a':'rgba(150,150,160,0.55)'))));
  ctx.fillStyle=col;ctx.fillRect(bx-1.6,by-1.6,3.2,3.2);
 }
 c4DrawMapLandmark(mx0+CITY_GUNSHOP.x*sc,my0+CITY_GUNSHOP.y*sc,8,'🔫','#ffcf4a');
 c4DrawMapLandmark(mx0+CITY_CASINO.x*sc,my0+CITY_CASINO.y*sc,8,'🎰','#ff4ad0');
 c4DrawMapLandmark(mx0+CITY_TUNING.x*sc,my0+CITY_TUNING.y*sc,8,'🔧','#8ac0ff');
 var fmCcx=mx0+mw/2,fmCcy=my0+mh/2,fmHalfW=mw/2-10,fmHalfH=mh/2-10;
 for(var k=0;k<c4Events.length;k++){
  var ev=c4Events[k];
  if(ev.state==='COMPLETED'||ev.state==='FAILED')continue;
  var fex=mx0+ev.npc.x*sc,fey=my0+ev.npc.y*sc;
  var pulse=0.6+0.4*Math.sin(gTime*6);
  var fddx=fex-fmCcx,fddy=fey-fmCcy;
  var outside=Math.abs(fddx)>fmHalfW||Math.abs(fddy)>fmHalfH;
  if(outside){
   var fang=Math.atan2(fddy,fddx);
   var fscale=Math.min(fmHalfW/Math.max(1,Math.abs(fddx)),fmHalfH/Math.max(1,Math.abs(fddy)));
   var fax=fmCcx+fddx*fscale,fay=fmCcy+fddy*fscale;
   ctx.save();ctx.translate(fax,fay);ctx.rotate(fang);
   ctx.fillStyle='rgba(255,30,20,'+pulse.toFixed(2)+')';
   ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-5,-6);ctx.lineTo(-5,6);ctx.closePath();ctx.fill();
   ctx.restore();
  }else{
   ctx.fillStyle='rgba(255,30,20,'+(pulse*0.5).toFixed(2)+')';
   ctx.beginPath();ctx.arc(fex,fey,10,0,TAU);ctx.fill();
   ctx.fillStyle=c4PriorityColor(ev.priority);ctx.globalAlpha=pulse;
   ctx.beginPath();ctx.arc(fex,fey,5,0,TAU);ctx.fill();ctx.globalAlpha=1;
  }
 }
 ctx.fillStyle='#8ac0ff';ctx.beginPath();ctx.arc(mx0+P.x*sc,my0+P.y*sc,4,0,TAU);ctx.fill();
 if(cityCar){ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(mx0+cityCar.x*sc,my0+cityCar.y*sc,4,0,TAU);ctx.fill();}
 ctx.fillStyle='#e8e4d8';ctx.font='bold 16px monospace';ctx.textAlign='center';
 ctx.fillText('CITY POLICE NETWORK',W/2,my0-16);
 ctx.font='12px monospace';ctx.fillStyle='#a8b0b8';
 ctx.fillText(L('U — закрыть карту','U — close the map'),W/2,my0+mh+22);
 ctx.restore();
}
function brSetupTouchTarget(){
 function pt(e){
  var t=e.touches[0]||e.changedTouches[0];
  var r=cvs.getBoundingClientRect();
  var sx=(t.clientX-r.left)*(W/r.width),sy=(t.clientY-r.top)*(H/r.height);
  return {x:cam.x-W/2+sx,y:cam.y-H/2+sy};
 }
 cvs.addEventListener('touchstart',function(e){
  if(PATROL!==6||mode!=='play'||e.target!==cvs)return;
  var w=pt(e);
  brTouchTarget.active=true;brTouchTarget.x=w.x;brTouchTarget.y=w.y;
 },{passive:true});
 cvs.addEventListener('touchmove',function(e){
  if(PATROL!==6||mode!=='play'||!brTouchTarget.active||e.target!==cvs)return;
  var w=pt(e);
  brTouchTarget.x=w.x;brTouchTarget.y=w.y;
 },{passive:true});
}
brSetupTouchTarget();
reset();
menuInit();
recheckMetaAchievements();
requestAnimationFrame(loop);
})();
</script>
