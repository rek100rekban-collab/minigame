function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function angN(a){a%=TAU;if(a>Math.PI)a-=TAU;if(a<-Math.PI)a+=TAU;return a;}
function angDiff(a,b){return Math.abs(angN(a-b));}
function far(x,y,arr,d){for(var i=0;i<arr.length;i++){if(Math.hypot(arr[i].x-x,arr[i].y-y)<d)return false;}return true;}
function segCircle(x1,y1,x2,y2,cx,cy,r){
 var dx=x2-x1,dy=y2-y1;var l2=dx*dx+dy*dy||1;
 var s=((cx-x1)*dx+(cy-y1)*dy)/l2;s=clamp(s,0,1);
 var px=x1+dx*s,py=y1+dy*s;
 return (cx-px)*(cx-px)+(cy-py)*(cy-py)<r*r;
}
function losClear(x1,y1,x2,y2){
 for(var i=0;i<trees.length;i++){
  var t=trees[i];
  if(segCircle(x1,y1,x2,y2,t.x,t.y,t.r*0.85))return false;
 }
 return true;
}
function collideEnt(o,r){
 for(var i=0;i<trees.length;i++){
  var t=trees[i];
  var dx=o.x-t.x,dy=o.y-t.y;var d=Math.hypot(dx,dy);var rr=r+t.r;
  if(d<rr&&d>0.001){var p=(rr-d)/d;o.x+=dx/d*p;o.y+=dy/d*p;}
 }
 var cdx=o.x-CAR.x,cdy=o.y-CAR.y,cd=Math.hypot(cdx,cdy);
 if(cd<62&&cd>0.001){o.x+=cdx/cd*(62-cd);o.y+=cdy/cd*(62-cd);}
 o.x=clamp(o.x,30,WORLD-30);o.y=clamp(o.y,30,WORLD-30);
}

var AC=null,master=null,windG=null,staticG=null,droneG=null,noiseBuf=null;
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return;}
 var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
 AC=new A();
 master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
 noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
 var nd=noiseBuf.getChannelData(0);
 for(var i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 var ws=AC.createBufferSource();ws.buffer=noiseBuf;ws.loop=true;
 var wf=AC.createBiquadFilter();wf.type='lowpass';wf.frequency.value=260;
 windG=AC.createGain();windG.gain.value=0.03;
 ws.connect(wf);wf.connect(windG);windG.connect(master);ws.start();
 var ss=AC.createBufferSource();ss.buffer=noiseBuf;ss.loop=true;
 var sf=AC.createBiquadFilter();sf.type='bandpass';sf.frequency.value=1600;sf.Q.value=6;
 staticG=AC.createGain();staticG.gain.value=0;
 ss.connect(sf);sf.connect(staticG);staticG.connect(master);ss.start();
 var o1=AC.createOscillator();o1.type='sawtooth';o1.frequency.value=47;
 var o2=AC.createOscillator();o2.type='sawtooth';o2.frequency.value=94.5;
 var df=AC.createBiquadFilter();df.type='lowpass';df.frequency.value=170;
 droneG=AC.createGain();droneG.gain.value=0;
 o1.connect(df);o2.connect(df);df.connect(droneG);droneG.connect(master);
 o1.start();o2.start();
}
function nz(dur,f0,f1,vol,type,q){
 if(!AC)return;
 var t=AC.currentTime;
 var s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
 var f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);
 if(f1)f.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
 f.Q.value=q||1;
 var g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(master);
 s.start(t);s.stop(t+dur+0.05);
}
function tone(fr,dur,vol,type,f1){
 if(!AC)return;var t=AC.currentTime;
 var o=AC.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(fr,t);
 if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
 var g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}

function buildWorld(){
 trees=[];bushes=[];
 var tries=0;
 while(trees.length<340&&tries<16000){
  tries++;
  var x=70+Math.random()*(WORLD-140),y=70+Math.random()*(WORLD-140);
  if(y>RY0-50&&y<RY1+50)continue;
  if(!far(x,y,clues,95))continue;
  if(Math.hypot(x-CAR.x,y-CAR.y)<240)continue;
  if(!far(x,y,crates,70))continue;
  if(Math.hypot(x-SHOTGUN_POS.x,y-SHOTGUN_POS.y)<90)continue;
  if(Math.hypot(x-CABIN.x,y-CABIN.y)<130)continue;
  var ok=true;
  for(var i=0;i<trees.length;i++){if(Math.hypot(trees[i].x-x,trees[i].y-y)<46){ok=false;break;}}
  if(ok)trees.push({x:x,y:y,r:12+Math.random()*9,ph:Math.random()*6.28});
 }
 var bt=0;
 while(bushes.length<90&&bt<6000){
  bt++;
  var bx=80+Math.random()*(WORLD-160),by=60+Math.random()*(WORLD-140);
  if(by>RY0-20&&by<RY1+30)continue;
  if(!far(bx,by,clues,70))continue;
  if(Math.hypot(bx-CAR.x,by-CAR.y)<180)continue;
  var ok2=true;
  for(var j=0;j<trees.length;j++){if(Math.hypot(trees[j].x-bx,trees[j].y-by)<trees[j].r+40){ok2=false;break;}}
  if(ok2)bushes.push({x:bx,y:by,r:26+Math.random()*14});
 }
}

function emitNoise(x,y,r){
 if(!K||!K.active||K.stun>0)return;
 var d=Math.hypot(K.x-x,K.y-y);
 if(d<r){
  var loud=r-d;
  if(K.state!=='chase'){K.state='investigate';K.tx=x;K.ty=y;}
  K.aware=Math.min(140,K.aware+(loud>150?42:20));
 }
}
function moveKiller(tx,ty,sp,dt){
 var dx=tx-K.x,dy=ty-K.y;var dd=Math.hypot(dx,dy);
 if(dd<3)return;
 dx/=dd;dy/=dd;
 for(var i=0;i<trees.length;i++){
  var t=trees[i];
  var ax=K.x-t.x,ay=K.y-t.y;var d2=Math.hypot(ax,ay);
  if(d2<70&&d2>0.001){var f=(70-d2)/70*1.7;dx+=ax/d2*f;dy+=ay/d2*f;}
 }
 var l=Math.hypot(dx,dy)||1;
 K.x+=dx/l*sp*dt;K.y+=dy/l*sp*dt;
 K.head=angN(Math.atan2(dy,dx));
 collideEnt(K,15);
}
function updateKiller(dt){
 if(!K.active)return;
 var dx=P.x-K.x,dy=P.y-K.y,d=Math.hypot(dx,dy)||1;
 if(K.stun>0){
  K.stun-=dt;
  if(K.stun<=0){K.state='search';K.lx=P.x;K.ly=P.y;K.seekT=5;K.wT=0;}
  return;
 }
 if(d<24){die();return;}
 var dirA=Math.atan2(dy,dx);
 var vis=false;
 var viewR=(P.clues>=10?640:560)*(P.crouch?0.72:1);
 if(!P.hidden&&d<viewR&&(angDiff(dirA,K.head)<1.15||d<70)){
  if(losClear(K.x,K.y,P.x,P.y))vis=true;
 }
 var lit=false;
 if(P.flash&&d<520){
  var dot=(dx*Math.cos(P.a)+dy*Math.sin(P.a))/(d||1);
  if(dot>0.86&&losClear(K.x,K.y,P.x,P.y))lit=true;
 }
 if(lit){
  K.aware=Math.min(140,K.aware+dt*140);
  if(K.state!=='chase')K.head+=angN(dirA-K.head)*Math.min(1,dt*2.5);
 }
 if(vis)K.aware+=dt*(d<220?150:(d<380?85:45));
 else K.aware=Math.max(0,K.aware-dt*22);
 if(K.aware>=100&&K.state!=='chase'){
  K.state='chase';K.lost=0;sfx.sting();camShake=Math.max(camShake,0.5);
  centerFlash('ОН ТЕБЯ УВИДЕЛ. БЕГИ!',2.5);
 }
 if(K.state==='patrol'){
  K.reT-=dt;
  if(K.reT<=0||Math.hypot(K.tx-K.x,K.ty-K.y)<18){
   K.tx=200+Math.random()*(WORLD-400);K.ty=560+Math.random()*(WORLD-660);K.reT=7+Math.random()*5;
  }
  moveKiller(K.tx,K.ty,66,dt);
 }else if(K.state==='investigate'){
  if(Math.hypot(K.tx-K.x,K.ty-K.y)<26){K.state='search';K.seekT=4;K.lx=K.tx;K.ly=K.ty;K.wT=0;}
  moveKiller(K.tx,K.ty,150,dt);
 }else if(K.state==='search'){
  K.seekT-=dt;K.wT-=dt;
  if(K.wT<=0){K.wT=1.4;K.tx=K.lx+(Math.random()-0.5)*280;K.ty=K.ly+(Math.random()-0.5)*260;}
  moveKiller(K.tx,K.ty,115,dt);
  if(K.seekT<=0)K.state='patrol';
 }else if(K.state==='chase'){
  if(vis){K.lost=0;K.lx=P.x;K.ly=P.y;}
  var tx=vis?P.x:K.lx,ty=vis?P.y:K.ly;
  moveKiller(tx,ty,(P.clues>=10?238:212),dt);
  if(!vis){K.lost+=dt;if(K.lost>4){K.state='search';K.seekT=6;K.lx=tx;K.ly=ty;K.wT=0;}}
  if(d<340)K.head=angN(dirA);
 }
 if(!vis&&d<330&&P.sprint)K.aware=Math.min(140,K.aware+dt*35);
 K.stepT-=dt;
 if(K.stepT<=0&&d<620){
  K.stepT=(K.state==='chase')?0.3:0.55;
  sfx.kstep(Math.max(0.02,0.3*(1-d/600)));
 }
}
function updatePlayer(dt){
 var ax=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 var ay=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
 var mv=Math.hypot(ax,ay),dx=0,dy=0;
 if(mv>0){dx=ax/mv;dy=ay/mv;}
 P.crouch=!!(keys.ControlLeft||keys.ControlRight||keys.KeyC);
 var wantSprint=(keys.ShiftLeft||keys.ShiftRight)&&!P.crouch&&mv>0&&!P.exh&&P.stam>0;
 P.sprint=wantSprint;
 if(wantSprint){P.stam-=30*dt;if(P.stam<=0)P.exh=true;}
 else{P.stam=Math.min(100,P.stam+15*dt);if(P.stam>30)P.exh=false;}
 var spd=P.crouch?72:(wantSprint?250:132);
 P.x+=dx*spd*dt;P.y+=dy*spd*dt;
 collideEnt(P,13);
 var wx=cam.x-W/2+mouse.x,wy=cam.y-H/2+mouse.y;
 P.a=Math.atan2(wy-P.y,wx-P.x);
 P.hidden=false;
 if(P.crouch&&!P.flash){
  for(var i=0;i<bushes.length;i++){if(Math.hypot(bushes[i].x-P.x,bushes[i].y-P.y)<bushes[i].r){P.hidden=true;break;}}
 }
 if(mv>0){
  P.stepT+=dt;
  if(P.stepT>(P.crouch?0.6:(P.sprint?0.27:0.42))){
   P.stepT=0;
   sfx.step(P.crouch?0.04:(P.sprint?0.2:0.1));
   emitNoise(P.x,P.y,P.crouch?45:(P.sprint?270:130));
  }
 }
 P.cd=Math.max(0,P.cd-dt);P.sgcd=Math.max(0,P.sgcd-dt);
 if(mouse.l&&P.cd<=0)firePistol();
 if(mouse.r&&P.sgcd<=0&&P.hasShotgun)fireShotgun();
}
function update(dt){
 stats.t+=dt;
 updatePlayer(dt);
 updateKiller(dt);
 if(noteState.open){
  if(noteState.chars<noteState.text.length){
   noteState.chars=Math.min(noteState.text.length,noteState.chars+dt*70);
   noteTextEl.textContent=noteState.text.slice(0,Math.floor(noteState.chars));
  }
  noteState.closeT-=dt;
  if(noteState.closeT<=0)hideNote();
 }
 if(msgT>0){msgT-=dt;if(msgT<=0)centerEl.style.opacity='0';}
 var ns=[];
 for(var s=0;s<sparks.length;s++){
  var sp=sparks[s];sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.t-=dt;
  if(sp.t>0)ns.push(sp);
 }
 sparks=ns;
 for(var ff=0;ff<fireflies.length;ff++){
  var fl=fireflies[ff];fl.ph+=dt;
  fl.x+=Math.cos(fl.ph*0.53)*14*dt;fl.y+=Math.sin(fl.ph*0.61)*14*dt;
 }
 for(var fg=0;fg<fog.length;fg++){
  var fb=fog[fg];
  fb.x+=fb.vx*dt;fb.y+=fb.vy*dt;
  if(fb.x<-300)fb.x=WORLD+280;if(fb.x>WORLD+300)fb.x=-280;
  if(fb.y<-300)fb.y=WORLD+280;if(fb.y>WORLD+300)fb.y=-280;
 }
 cam.x+=(P.x-cam.x)*Math.min(1,dt*6);
 cam.y+=(P.y-cam.y)*Math.min(1,dt*6);
 cam.x=clamp(cam.x,Math.min(W/2,WORLD/2),Math.max(W/2,WORLD-W/2));
 cam.y=clamp(cam.y,Math.min(H/2,WORLD/2),Math.max(H/2,WORLD-H/2));
 if(AC){
  windT-=dt;
  if(windT<=0){windT=2.5+Math.random()*3;windG.gain.linearRampToValueAtTime(0.02+Math.random()*0.05,AC.currentTime+1.8);}
 }
 owlT-=dt;if(owlT<=0){owlT=14+Math.random()*20;if(!K.active)sfx.owl();}
 crackT-=dt;if(crackT<=0){crackT=9+Math.random()*15;sfx.crack();}
 fx.lt-=dt;
 if(fx.lt<=0){fx.ltA=0.55;fx.lt=18+Math.random()*22;if(AC)setTimeout(function(){sfx.thunder();},400+Math.random()*900);}
 fx.ltA=Math.max(0,fx.ltA-dt*1.3);
 fx.muzzle=Math.max(0,fx.muzzle-dt);
 if(K.active){
  var kd=Math.hypot(K.x-P.x,K.y-P.y);
  hbT-=dt;
  if(hbT<=0&&kd<620&&K.stun<=0){
   hbT=0.34+(kd/620)*0.75;
   sfx.heartbeat(Math.max(0.12,0.5-(kd/620)*0.4));
  }
  var tgt=(K.state==='chase')?1:((K.state==='search')?0.35:0.05);
  chaseMix+=(tgt-chaseMix)*Math.min(1,dt*2);
  if(droneG)droneG.gain.value=chaseMix*0.11;
 }else{
  chaseMix*=1-Math.min(1,dt*2);
  if(droneG)droneG.gain.value=chaseMix*0.09;
 }
 if(AC&&staticG){
  var ndist=1e9;
  for(var ci=0;ci<clues.length;ci++){
   if(!clues[ci].got){
    var cd2=Math.hypot(clues[ci].x-P.x,clues[ci].y-P.y);
    if(cd2<ndist)ndist=cd2;
   }
  }
  var gv=Math.max(0,1-ndist/300)*0.12;
  staticG.gain.value+=((gSTATIC())-staticG.gain.value)*0;
  staticG.gain.value+=((gSTATIC())-staticG.gain.value)*0;
  staticG.gain.value+=(gv-staticG.gain.value)*Math.min(1,dt*4);
 }
 if(K.active)fogN=Math.min(1,fogN+dt*0.06);
 if(P.clues>=10&&Math.hypot(P.x-CAR.x,P.y-CAR.y)<95)winGame();
 camShake=Math.max(0,camShake-dt*2.2);
 updHUD();
}

 var line='Пистолет: '+P.ammo+' | Магазины: '+P.mags;
 if(P.hasShotgun)line+=' | Дробовик: '+P.sg;
 ammoLineEl.textContent=line;
 stamBarEl.style.width=clamp(P.stam,0,100)+'%';

 var label='';
 if(P.hidden){label='ТЫ СПРЯТАЛСЯ — НЕ ШЕВЕЛИСЬ';}
 else{
  var bd=58;
  for(var i=0;i<clues.length;i++){
   if(!clues[i].got){var d=Math.hypot(clues[i].x-P.x,clues[i].y-P.y);if(d<bd){bd=d;label='E — ОСМОТРЕТЬ: '+clues[i].t;}}
  }
  if(!shotgun.got){var d2=Math.hypot(shotgun.x-P.x,shotgun.y-P.y);if(d2<bd){bd=d2;label='E — ВЗЯТЬ ДВУСТВОЛКУ';}}
  for(var j=0;j<crates.length;j++){
   if(!crates[j].got){var d3=Math.hypot(crates[j].x-P.x,crates[j].y-P.y);if(d3<bd){bd=d3;label='E — ВЗЯТЬ МАГАЗИН 9×19';}}
  }
  if(shells&&!shells.got){var d4=Math.hypot(shells.x-P.x,shells.y-P.y);if(d4<bd){bd=d4;label='E — ПАТРОНЫ К ДРОБОВИКУ';}}
  if(!label&&Math.hypot(P.x-CAR.x,P.y-CAR.y)<130&&P.clues<10)label='Патрульная машина. Сначала — все улики ('+P.clues+'/10)';

function firePistol(){
 if(!P||P.cd>0)return;
 P.cd=0.24;
 if(P.ammo<=0){sfx.click();centerFlash('ПУСТО — [R] СМЕНИТЬ МАГАЗИН',1.4);return;}
 P.ammo--;stats.shots++;sfx.shot();fx.muzzle=0.09;
 emitNoise(P.x,P.y,1350);camShake=Math.max(camShake,0.25);
 var dx=Math.cos(P.a),dy=Math.sin(P.a);
 var best=760,hitK=false;
 for(var i=0;i<trees.length;i++){
  var t=trees[i];
  var rx=t.x-P.x,ry=t.y-P.y;var tt=rx*dx+ry*dy;
  if(tt>0&&tt<best&&Math.abs(dx*ry-dy*rx)<t.r)best=tt;
 }
 if(K.active&&K.stun<=0){
  var rx=K.x-P.x,ry=K.y-P.y;var tt2=rx*dx+ry*dy;
  if(tt2>0&&tt2<best&&Math.abs(dx*ry-dy*rx)<16){best=tt2;hitK=true;}
 }
 fx.mx=P.x+dx*26;fx.my=P.y+dy*24;
 if(hitK){
  for(var s=0;s<6;s++)sparks.push({x:K.x,y:K.y,vx:(Math.random()-0.5)*90,vy:(Math.random()-0.5)*90,t:0.25,c:'#ffd77a'});
  K.aware=Math.min(140,K.aware+70);
  if(!K.shotMsg){K.shotMsg=true;centerFlash('ПУЛИ ПРОХОДЯТ СКВОЗЬ НЕГО. ОН НЕ ОСТАНАВЛИВАЕТСЯ.',3.2);}
 }else{
  var hx=P.x+dx*best,hy=P.y+dy*best;
  for(var s2=0;s2<4;s2++)sparks.push({x:hx,y:hy,vx:(Math.random()-0.5)*70,vy:(Math.random()-0.5)*80,t:0.18,c:'#8a8f96'});
 }

function fireShotgun(){

function tryInteract(){
 var bd=58,kind='',obj=null;
 for(var i=0;i<clues.length;i++){if(!clues[i].got){var d=Math.hypot(clues[i].x-P.x,clues[i].y-P.y);if(d<bd){bd=d;kind='clue';obj=clues[i];}}}
 if(!shotgun.got){var d2=Math.hypot(shotgun.x-P.x,shotgun.y-P.y);if(d2<bd){bd=d2;kind='sg';obj=shotgun;}}
 for(var j=0;j<crates.length;j++){if(!crates[j].got){var d3=Math.hypot(crates[j].x-P.x,crates[j].y-P.y);if(d3<bd){bd=d3;kind='crate';obj=crates[j];}}}
 if(shells&&!shells.got){var d4=Math.hypot(shells.x-P.x,shells.y-P.y);if(d4<bd){bd=d4;kind='shells';}}

 if(kind==='clue'){

  if(obj.ammo)P.mags++;
  if(P.clues===4)spawnKiller();
  if(P.clues===10){
   centerFlash('ВСЁ СОБРАНО. БЕГИ К МАШИНЕ!',4);
   objectiveEl.textContent='ВСЕ УЛИКИ СОБРАНЫ. БЕГИ К ПАТРУЛЬНОЙ МАШИНЕ!';

 }else if(kind==='sg'){

 }else if(kind==='crate'){
  obj.got=true;P.mags++;sfx.pickup();centerFlash('МАГАЗИН 9×19 (+10 ПАТР.)',1.8);
 }else if(kind==='shells'){
  shells.got=true;P.sg=Math.min(4,P.sg+2);sfx.pickup();centerFlash('ПАТРОНЫ К ДРОБОВИКУ (+2)',1.8);
 }
 updHUD();

function drawClues(){
 for(var i=0;i<clues.length;i++){
  var c=clues[i];
  if(c.got&&c.k!=='blood'&&c.k!=='body'&&c.k!=='marks')continue;
  if(c.x<view.x0-40||c.x>view.x1+40||c.y<view.y0-40||c.y>view.y1+40)continue;
  var p=0.5+0.5*Math.sin(gTime*2.4+i*1.3);
  if(!c.got){
   ctx.strokeStyle='rgba(170,220,150,'+(0.15+0.3*p).toFixed(2)+')';
   ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(c.x,c.y,13+4*p,0,TAU);ctx.stroke();
  }
  ctx.save();ctx.translate(c.x,c.y);
  if(c.k==='note'||c.k==='note2'||c.k==='map'){
   ctx.rotate(0.35);
   ctx.fillStyle='#cfc9b2';ctx.fillRect(-6,-7,12,14);
   ctx.fillStyle='#6a6455';ctx.fillRect(-3,-2,6,1.5);ctx.fillRect(-3,1,6,1.5);ctx.fillRect(-3,5,4,1.5);
  }else if(c.k==='blood'){
   ctx.fillStyle='#4a0d0d';
   ctx.beginPath();ctx.arc(0,0,8,0,TAU);ctx.arc(9,4,5,0,TAU);ctx.arc(-7,-5,5,0,TAU);ctx.fill();
  }else if(c.k==='tape'){
   ctx.fillStyle='#20242a';ctx.fillRect(-8,-5,16,10);
   ctx.fillStyle='#c8cdd4';ctx.fillRect(-5,-2,10,4);
  }else if(c.k==='phone'){
   ctx.fillStyle='#101216';ctx.fillRect(-5,-8,10,16);
  }else if(c.k==='flask'){
   ctx.fillStyle='#9aa4ad';ctx.beginPath();ctx.arc(0,0,5,0,TAU);ctx.fill();
   ctx.fillStyle='#4a5057';ctx.fillRect(-2,-7,4,4);
  }else if(c.k==='marks'){
   ctx.strokeStyle='#5a3a1a';ctx.lineWidth=3;
   ctx.beginPath();ctx.moveTo(-9,-10);ctx.lineTo(-3,9);ctx.moveTo(1,-9);ctx.lineTo(0,8);ctx.moveTo(7,-9);ctx.lineTo(11,7);ctx.stroke();
  }else if(c.k==='body'){
   ctx.fillStyle='#191216';
   ctx.beginPath();ctx.ellipse(0,0,12,7,0.4,0,TAU);ctx.fill();
   ctx.fillStyle='#3a0d0d';ctx.beginPath();ctx.arc(7,-3,3.4,0,TAU);ctx.fill();
  }else if(c.k==='gps'){
   ctx.fillStyle='#161a16';ctx.fillRect(-7,-5,14,10);
   ctx.fillStyle='#7fda7f';ctx.fillRect(-4,-2,3,2.4);
  }
  ctx.restore();
 }
}
function drawItems(){
 var i;
 for(i=0;i<crates.length;i++){
  if(crates[i].got)continue;
  ctx.fillStyle='#2c3a2a';ctx.fillRect(crates[i].x-9,crates[i].y-6,18,12);
  ctx.fillStyle='#3c4c38';ctx.fillRect(crates[i].x-9,crates[i].y-6,18,3);
  ctx.strokeStyle='#131c11';ctx.lineWidth=1.5;ctx.strokeRect(crates[i].x-9,crates[i].y-6,18,12);
 }
 if(shells&&!shells.got){
  ctx.fillStyle='#7a2020';ctx.fillRect(shells.x-7,shells.y-5,14,10);
  ctx.fillStyle='#d8b24a';ctx.fillRect(shells.x-7,shells.y-5,14,2.5);
 }
 if(!shotgun.got){
  ctx.save();ctx.translate(shotgun.x,shotgun.y);ctx.rotate(-0.5);
  ctx.fillStyle='#5a3a1c';ctx.fillRect(-19,-3,15,6);
  ctx.fillStyle='#33363c';ctx.fillRect(-5,-3.6,23,2.2);
  ctx.fillStyle='#3a3d42';ctx.fillRect(-4,-0.6,22,2.2);
  ctx.restore();
 }
}
function drawCabin(){
 ctx.fillStyle='#221910';ctx.fillRect(CABIN.x-32,CABIN.y-26,64,48);
 ctx.fillStyle='#120d07';
 ctx.beginPath();ctx.moveTo(CABIN.x-40,CABIN.y-24);ctx.lineTo(CABIN.x,CABIN.y-50);ctx.lineTo(CABIN.x+40,CABIN.y-24);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#312415';ctx.lineWidth=2;ctx.strokeRect(CABIN.x-32,CABIN.y-26,64,52);
 ctx.fillStyle='#3a2f18';ctx.fillRect(CABIN.x-26,CABIN.y-10,12,12);
 ctx.fillStyle='#0f0a06';ctx.fillRect(CABIN.x-8,CABIN.y,16,26);
 ctx.fillStyle='#2a2f35';ctx.fillRect(CABIN.x-56,CABIN.y-4,4,22);
 ctx.fillStyle='#ffd98a';
 ctx.beginPath();ctx.arc(CABIN.x-58,CABIN.y-8,4,0,TAU);ctx.fill();
}
function drawCar(){
 ctx.save();ctx.translate(CAR.x,CAR.y);
 ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(-46,-22,100,48);
 ctx.fillStyle='#dfe3e8';ctx.fillRect(-46,-21,92,42);
 ctx.fillStyle='#1c2c5a';ctx.fillRect(-24,-21,54,42);
 ctx.fillStyle='#0f1524';ctx.fillRect(-12,-17,20,34);
 var bt=Math.sin(gTime*4);
 ctx.fillStyle=bt>0?'#ff5252':'#4d1a1a';ctx.fillRect(-14,-14,10,8);
 ctx.fillStyle=bt>0?'#122a4d':'#5a8cff';ctx.fillRect(2,-21,10,8);
 ctx.fillStyle='#1a1c22';
 ctx.fillRect(-44,-27,12,7);ctx.fillRect(-40,14,12,7);
 ctx.fillRect(30,-27,10,7);ctx.fillRect(26,22,12,5);
 ctx.restore();
}
function drawTrees(){
 for(var i=0;i<trees.length;i++){
  var t=trees[i];
  if(t.x<view.x0-60||t.x>view.x1+60||t.y<view.y0-60||t.y>view.y1+60)continue;
  var sw=Math.sin(gTime*0.8+t.ph)*2;
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath();ctx.ellipse(t.x+5,t.y+6,t.r*1.3,t.r*0.9,0,0,TAU);ctx.fill();
  ctx.fillStyle='#221a12';
  ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,TAU);ctx.fill();
  ctx.fillStyle='#12200f';
  ctx.beginPath();ctx.arc(t.x+sw,t.y,t.r*2.2,0,TAU);ctx.fill();
  ctx.fillStyle='#1a3015';
  ctx.beginPath();ctx.arc(t.x-4+sw,t.y-4,t.r*1.55,0,TAU);ctx.fill();
  ctx.fillStyle='#25401e';
  ctx.beginPath();ctx.arc(t.x-6+sw,t.y-6,t.r*0.8,0,TAU);ctx.fill();
 }
}
function drawBushes(){
 ctx.globalAlpha=0.88;
 for(var i=0;i<bushes.length;i++){
  var b=bushes[i];
  if(b.x<view.x0-60||b.x>view.x1+60||b.y<view.y0-60||b.y>view.y1+60)continue;
  ctx.fillStyle='#0f1d10';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
  ctx.fillStyle='#152817';ctx.beginPath();ctx.arc(b.x-b.r*0.25,b.y-b.r*0.2,b.r*0.6,0,TAU);ctx.fill();
  ctx.fillStyle='#1b3320';ctx.beginPath();ctx.arc(b.x+b.r*0.3,b.y+b.r*0.2,b.r*0.4,0,TAU);ctx.fill();
 }
 ctx.globalAlpha=1;
}
function drawPlayer(){
 ctx.save();ctx.translate(P.x,P.y);
 ctx.fillStyle='rgba(0,0,0,0.4)';
 ctx.beginPath();ctx.ellipse(0,4,15,10,0,0,TAU);ctx.fill();
 ctx.rotate(P.a);
 if(P.crouch)ctx.scale(0.88,0.88);
 ctx.fillStyle='#243456';
 ctx.beginPath();ctx.ellipse(0,0,13,10,0,0,TAU);ctx.fill();
 ctx.fillStyle='#1a2746';
 ctx.beginPath();ctx.ellipse(-1,0,8.5,7,0,0,TAU);ctx.fill();
 ctx.fillStyle='#3a3f46';ctx.fillRect(3,3,14,4.2);
 if(P.flash){ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(18,5,2.6,0,TAU);ctx.fill();}
 ctx.fillStyle='#14161a';ctx.fillRect(3,-8,13,3.8);
 ctx.fillStyle='#c9a27a';
 ctx.beginPath();ctx.arc(1.5,0,6.4,0,TAU);ctx.fill();
 ctx.fillStyle='#16233e';
 ctx.beginPath();ctx.arc(0.5,0,7,0,TAU);ctx.fill();
 ctx.fillStyle='#0d1526';
 ctx.beginPath();ctx.ellipse(4.5,0,5,6.4,0,0,TAU);ctx.fill();
 ctx.fillStyle='#d8b24a';
 ctx.beginPath();ctx.arc(-2,-3,1.6,0,TAU);ctx.fill();
 ctx.restore();
}
function drawKiller(){
 if(!K.active)return;
 if(K.x<view.x0-60||K.x>view.x1+60||K.y<view.y0-120||K.y>view.y1+120)return;
 ctx.save();ctx.translate(K.x,K.y);
 ctx.fillStyle='rgba(0,0,0,0.45)';
 ctx.beginPath();ctx.ellipse(0,6,18,10,0,0,TAU);ctx.fill();
 var rot=K.head+(K.stun>0?Math.sin(gTime*20)*0.35:0);
 ctx.rotate(rot);
 ctx.fillStyle='#0b0b0e';
 ctx.beginPath();ctx.ellipse(0,0,12,16,0,0,TAU);ctx.fill();
 if(K.state==='chase'||K.stun>0){
  ctx.strokeStyle='#08080a';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(3,-9);ctx.lineTo(25,-17);ctx.moveTo(3,9);ctx.lineTo(25,17);ctx.stroke();
 }
 ctx.fillStyle='#b3ab9d';
 ctx.beginPath();ctx.arc(6,0,7,0,TAU);ctx.fill();
 ctx.fillStyle='#050506';
 ctx.beginPath();ctx.ellipse(2,0,12,8.5,0,0,TAU);ctx.fill();
 ctx.fillStyle='#0a0a0c';
 ctx.beginPath();ctx.arc(7,0,5,0,TAU);ctx.fill();
 ctx.restore();
}
function drawLights(shx,shy){
 var dark=0.90+(K.active?0.03:0)+((K.active&&K.state==='chase')?0.02:0);
 dark=Math.min(0.965,dark)*(1-fx.ltA*0.85);
 lctx.setTransform(1,0,0,1,0,0);
 lctx.globalCompositeOperation='source-over';
 lctx.clearRect(0,0,W,H);
 lctx.fillStyle='rgba(2,4,9,'+dark.toFixed(3)+')';
 lctx.fillRect(0,0,W,H);
 lctx.save();
 lctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 lctx.globalCompositeOperation='destination-out';
 hole(cam.x,cam.y,Math.max(W,H)*0.8,0.13);
 hole(P.x,P.y,48,0.32);
 if(P.flash){
  var g=lctx.createRadialGradient(P.x,P.y,30,P.x,P.y,430);
  g.addColorStop(0,'rgba(0,0,0,0.97)');
  g.addColorStop(0.72,'rgba(0,0,0,0.55)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  lctx.fillStyle=g;
  lctx.beginPath();lctx.moveTo(P.x,P.y);
  lctx.arc(P.x,P.y,430,P.a-0.5,P.a+0.5);
  lctx.closePath();lctx.fill();
 }
 hole(CAR.x,CAR.y,110,0.5);
 var bph=Math.sin(gTime*4);
 hole(CAR.x-14,CAR.y,58+8*bph,0.25+0.25*Math.max(0,bph));
 hole(CAR.x+14,CAR.y,58+8*Math.max(0,-bph),0.25+0.25*Math.max(0,-bph));
 hole(CABIN.x-58,CABIN.y-8,140+Math.sin(gTime*9)*12,0.75);
 var i;
 for(i=0;i<clues.length;i++){
  if(!clues[i].got)hole(clues[i].x,clues[i].y,30,0.22+0.1*Math.sin(gTime*2.4+i));
 }
 if(!shotgun.got)hole(shotgun.x,shotgun.y,26,0.22);
 for(i=0;i<crates.length;i++)if(!crates[i].got)hole(crates[i].x,crates[i].y,26,0.22);
 if(shells&&!shells.got)hole(shells.x,shells.y,24,0.2);
 if(fx.muzzle>0)hole(fx.mx,fx.my,170,Math.min(1,fx.muzzle*7));
 if(K.active&&K.stun>0)hole(K.x,K.y,70,0.5);
 for(i=0;i<fireflies.length;i++){
  var f=fireflies[i];
  hole(f.x,f.y,22,0.28+0.22*Math.sin(gTime*3+f.ph));
 }
 if(fx.ltA>0){
  lctx.fillStyle='rgba(0,0,0,'+(fx.ltA*0.9).toFixed(3)+')';
  lctx.fillRect(cam.x-W/2-100,cam.y-H/2-100,W+200,H+200);
 }
 lctx.restore();
 ctx.save();
 ctx.setTransform(1,0,0,1,0,0);
 ctx.drawImage(lcv,0,0);
 ctx.restore();
}
function drawGlows(shx,shy){
 ctx.save();
 ctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 ctx.globalCompositeOperation='lighter';
 var i;
 if(fx.muzzle>0)glowC(fx.mx,fx.my,130,'rgba(255,235,170,'+Math.min(0.7,fx.muzzle*5).toFixed(3)+')');
 glowC(CAR.x-14,CAR.y,26,'rgba(255,70,70,'+(0.1+0.16*Math.max(0,Math.sin(gTime*4))).toFixed(3)+')');
 glowC(CAR.x+14,CAR.y,26,'rgba(80,140,255,'+(0.1+0.16*Math.max(0,-Math.sin(gTime*4))).toFixed(3)+')');
 glowC(CABIN.x-58,CABIN.y-8,50,'rgba(255,215,140,'+(0.12+0.05*Math.sin(gTime*9)).toFixed(3)+')');
 if(P.clues>=10)glowC(CAR.x,CAR.y,140+70*(0.5+0.5*Math.sin(gTime*3)),'rgba(255,215,120,'+(0.06+0.08*(0.5+0.5*Math.sin(gTime*3))).toFixed(3)+')');
 for(i=0;i<clues.length;i++){
  var c=clues[i];
  if(c.got)continue;
  var col=null;
  if(c.k==='phone')col='125,220,255';
  if(c.k==='gps')col='125,235,140';
  if(c.k==='tape')col='255,110,90';
  if(col)glowC(c.x,c.y,16,'rgba('+col+','+(0.3+0.25*Math.sin(gTime*3+i)).toFixed(3)+')');
 }
 for(i=0;i<fireflies.length;i++){
  var f=fireflies[i];
  var fa=0.3+0.3*Math.sin(gTime*2.6+f.ph);
  glowC(f.x,f.y,10,'rgba(190,255,180,'+Math.max(0,fa).toFixed(3)+')');
 }
 if(K.active){
  var ex=K.x+Math.cos(K.head)*8,ey=K.y+Math.sin(K.head)*8;
  var ox=Math.cos(K.head+Math.PI/2)*2.6,oy=Math.sin(K.head+Math.PI/2)*2.6;
  var ec=(K.stun>0)?'255,215,120':'255,45,45';
  var ea=(K.stun>0)?(0.3+0.3*Math.sin(gTime*15)):(0.5+0.4*chaseMix);
  glowC(ex,ey,15,'rgba('+ec+','+Math.max(0,ea).toFixed(3)+')');
  ctx.fillStyle='rgba('+ec+',0.95)';
  ctx.beginPath();ctx.arc(ex+ox,ey+oy,1.8,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(ex-ox,ey-oy,1.8,0,TAU);ctx.fill();
 }
 for(i=0;i<sparks.length;i++){
  var sp=sparks[i];
  ctx.globalAlpha=Math.min(1,sp.t*4);
  ctx.fillStyle=sp.c;
  ctx.beginPath();ctx.arc(sp.x,sp.y,2.2,0,TAU);ctx.fill();
 }
 ctx.globalAlpha=1;
 ctx.restore();
}
function drawFogWorld(shx,shy){
 ctx.save();
 ctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 for(var i=0;i<fog.length;i++){
  var f=fog[i];
  if(f.x<view.x0-100||f.x>view.x1+100||f.y<view.y0-100||f.y>view.y1+100)continue;
  var fa=0.035+fogN*0.05;
  var g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
  g.addColorStop(0,'rgba(155,165,160,'+fa.toFixed(3)+')');
  g.addColorStop(1,'rgba(155,165,160,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill();
 }
 ctx.restore();
}
function drawVignette(){
 var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,Math.max(W,H)*0.72);
 vg.addColorStop(0,'rgba(0,0,0,0)');
 vg.addColorStop(1,'rgba(0,0,0,0.6)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 if(fx.ltA>0){
  ctx.fillStyle='rgba(205,218,255,'+(fx.ltA*0.3).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
 }
 if(chaseMix>0.02){
  var rg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);
  var ra=Math.max(0,(0.09+0.06*Math.sin(gTime*6))*chaseMix);
  rg.addColorStop(0,'rgba(140,10,10,0)');
  rg.addColorStop(1,'rgba(150,15,15,'+ra.toFixed(3)+')');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
 }
}
function drawMinimap(){
 var ms=150,mx0=W-ms-16,my0=14,sc=ms/WORLD;
 ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(mx0,my0,ms,ms);
 ctx.fillStyle='#1c2126';ctx.fillRect(mx0,my0,ms,RY1*sc);
 ctx.strokeStyle='#3c4450';ctx.lineWidth=1;ctx.strokeRect(mx0+0.5,my0+0.5,ms-1,ms-1);
 for(var i=0;i<clues.length;i++){
  var c=clues[i];
  if(c.got){
   ctx.fillStyle='#39412f';ctx.fillRect(mx0+c.x*sc-1.5,my0+c.y*sc-1.5,3,3);
  }else if(Math.hypot(c.x-P.x,c.y-P.y)<330){
   ctx.fillStyle='rgba(255,205,95,'+(0.35+0.35*Math.sin(gTime*6)).toFixed(2)+')';
   ctx.beginPath();ctx.arc(mx0+c.x*sc,my0+c.y*sc,2.4,0,TAU);ctx.fill();
  }
 }
 ctx.fillStyle='#5aa2ff';ctx.fillRect(mx0+CAR.x*sc-3,my0+CAR.y*sc-2,6,4);
 if(K.active){
  var kd=Math.hypot(K.x-P.x,K.y-P.y);
  if((kd<420||K.state==='chase')&&Math.sin(gTime*9)>-0.4){
   ctx.fillStyle='#ff4040';
   ctx.beginPath();ctx.arc(mx0+K.x*sc,my0+K.y*sc,2.4,0,TAU);ctx.fill();
  }
 }
 ctx.fillStyle='#fff';
 ctx.beginPath();ctx.arc(mx0+P.x*sc,my0+P.y*sc,2.4,0,TAU);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,0.6)';
 ctx.beginPath();ctx.moveTo(mx0+P.x*sc,my0+P.y*sc);
 ctx.lineTo(mx0+(P.x+Math.cos(P.a)*26)*sc,my0+(P.y+Math.sin(P.a)*26)*sc);
 ctx.stroke();
}
function drawCrosshair(){
 ctx.strokeStyle='rgba(255,255,255,0.55)';
 ctx.lineWidth=1.3;
 ctx.beginPath();ctx.arc(mouse.x,mouse.y,5,0,TAU);ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(mouse.x-10,mouse.y);ctx.lineTo(mouse.x-6,mouse.y);
 ctx.moveTo(mouse.x+6,mouse.y);ctx.lineTo(mouse.x+10,mouse.y);
 ctx.moveTo(mouse.x,mouse.y-10);ctx.lineTo(mouse.x,mouse.y-6);
 ctx.moveTo(mouse.x,mouse.y+6);ctx.lineTo(mouse.x,mouse.y+10);
 ctx.stroke();
}
function render(){
 if(!P)return;
 var shx=(Math.random()-0.5)*camShake*14,shy=(Math.random()-0.5)*camShake*12;
 view.x0=cam.x-W/2-120;view.y0=cam.y-H/2-120;
 view.x1=cam.x+W/2+120;view.y1=cam.y+H/2+120;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.fillStyle='#04070a';ctx.fillRect(0,0,W,H);
 ctx.save();
 ctx.translate(W/2-cam.x+shx,H/2-cam.y+shy);
 drawGround();
 drawRoad();
 drawTrails();
 drawClues();
 drawItems();
 drawCabin();
 drawCar();
 drawTrees();
 drawKiller();
 drawPlayer();
 drawBushes();
 ctx.globalCompositeOperation='lighter';
 for(var s=0;s<sparks.length;s++){
  ctx.globalAlpha=Math.min(1,sparks[s].t*4);
  ctx.fillStyle=sparks[s].c;
  ctx.beginPath();ctx.arc(sparks[s].x,sparks[s].y,2.2,0,TAU);ctx.fill();
 }
 ctx.globalAlpha=1;
 ctx.globalCompositeOperation='source-over';
 ctx.restore();
 drawLights(shx,shy);
 drawGlows(shx,shy);
 drawFogWorld(shx,shy);
 ctx.setTransform(1,0,0,1,0,0);
 drawVignette();
 drawMinimap();
 drawCrosshair();
}
function loop(now){
 var dt=(now-last)/1000;last=now;
 if(!(dt>0)||dt>0.05)dt=0.016;
 gTime+=dt;
 if(mode==='play')update(dt);
 render();
 requestAnimationFrame(loop);
}
reset();
menuInit();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
